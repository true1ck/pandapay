name: pandapay
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  pandapay_domain:
    path: ../packages/pandapay_domain

  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  # Access/refresh tokens must live in the OS keychain/keystore, not
  # SharedPreferences' plaintext plist/XML (OWASP M9) — see token_store.dart.
  flutter_secure_storage: ^11.0.0

  # Design system: Google Fonts for the Plus Jakarta Sans/Inter pairing
  # (see lib/app/design/app_theme.dart) and flutter_animate for the
  # 150-300ms micro-interactions used across the redesigned screens.
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # UA-4 (Chunk 30): camera/QR card scanning. mobile_scanner drives the
  # QR/barcode path wired up in this chunk; google_mlkit_text_recognition is
  # wired for the still-photo OCR path (isolated behind CardTextRecognizer)
  # but, like mobile_scanner's camera preview, could not be exercised on
  # real hardware in this sandbox — see PROGRESS.md Chunk 30.
  mobile_scanner: ^7.0.0

  # UA-5.3 (Chunk 31): SMS-based transaction auto-import. `telephony` wraps
  # the RECEIVE_SMS BroadcastReceiver + READ_SMS query so an incoming bank
  # SMS reaches Dart as a plain (sender, body) pair without hand-written
  # platform-channel/Kotlin code; `permission_handler` drives the runtime
  # permission-request UI (Android 6+ requires this to be asked at runtime,
  # not just declared in the manifest). Both are structurally wired
  # (SmsListenerService, PermissionGate) but NOT exercised against a real
  # device/real SMS in this sandbox — see PROGRESS.md Chunk 31.
  telephony: ^0.2.0
  permission_handler: ^11.3.1

  # UA-8 (Chunk 32, extended): geofencing + home-screen widget. `geolocator`
  # drives both the original foreground-triggered one-shot "check nearby
  # merchants" location read (app/lib/features/geofence/nearby_merchants_screen.dart)
  # AND, as of the background-geofencing pass, an optional background
  # position stream (geofence_monitor_service.dart) using geolocator's own
  # Android foreground-service / iOS background-mode support — no separate
  # geofencing package added, since geolocator already covers this and the
  # rest of the app's location code is already built on it.
  # `flutter_local_notifications` is what actually surfaces a background
  # geofence match to the user (a stream running with nothing rendering it
  # isn't a real geofence feature) — the one genuinely new dependency this
  # pass adds. `home_widget` writes the "best card right now" data to
  # native shared storage and triggers a widget refresh
  # (app/lib/features/home_widget/). None of the actual OS location/
  # notification prompts nor native widget rendering could be exercised in
  # this sandbox (no device/simulator/native build toolchain run end-to-end)
  # — flagged, not hidden, same posture as every other native-permission
  # feature in this file.
  geolocator: ^13.0.2
  flutter_local_notifications: ^18.0.1
  home_widget: ^0.7.0
  rive: ^0.14.11
  flex_color_scheme: ^8.4.0
  responsive_framework: ^1.5.1

  # B2 (Group B): gallery import — scanning a UPI QR from a screenshot
  # rather than the live camera (ui-spec B2.2). mobile_scanner's
  # analyzeImage(path) decodes a QR from an arbitrary image file; something
  # has to hand it a file path from the user's photo gallery, which is this
  # package's whole job. Same "added without a live device/pub-get
  # verification in this sandbox" caveat as mobile_scanner/geolocator above
  # (see PROGRESS.md Chunks 30/32) — flagged, not hidden.
  image_picker: ^1.2.3

  # B3 (Task 12) / G4 (Chunk 38): launches the `upi://pay?...` intent built
  # by buildUpiPayUri (packages/pandapay_domain) for "Pay with [card]", and
  # the one-tap `tel:` dial from Emergency Card Info — both core, explicit
  # spec requirements, not optional niceties, unlike F2/F4/F6's
  # PDF-parsing/share-sheet packages (Chunk 37 scoped those OUT specifically
  # because this sandbox has no Flutter SDK to `pub get`/compile a new native
  # plugin against). url_launcher is a much lower-risk addition than those —
  # a thin, extremely widely-used platform-channel wrapper with a small,
  # stable API — and this codebase already has precedent (Chunks 30-32) for
  # adding native plugins without live device verification. Still unverified
  # by a real `pub get`/build in this environment — flagged, not hidden.
  url_launcher: ^6.3.1
  path_provider: ^2.1.6
  package_info_plus: ^10.2.1
  intl: ^0.20.3

  # UA-0.3 offline-first local cache (GAP_ANALYSIS.md §2, plan
  # docs/superpowers/plans/2026-08-08-offline-first-local-cache.md): raw
  # sqlite3 (not drift) backs a raw-JSON-blob cache (not a relational
  # schema mirror — see the plan's Architecture note for why) so
  # catalogue/wallet/overrides survive a lost connection, plus a B6
  # quick-add offline write queue. Plain SQL, no code generation —
  # drift_dev's build_runner step was tried first and dropped: every
  # drift_dev version compatible with pandapay_lints' analyzer ^7.0.0 hits
  # a genuine analyzer crash (DotShorthandInvocationImpl in
  # bundle_writer.dart) on this codebase's existing `'key': ?value` null-
  # shorthand syntax, and every drift_dev version that avoids the crash
  # needs an analyzer/build version pandapay_lints or riverpod_generator
  # can't satisfy. sqlite3 needs no codegen, so the conflict doesn't apply.
  # connectivity_plus drives the online/offline signal.
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.42
  path: ^1.9.0
  connectivity_plus: ^7.3.1

  # F2 (ui-spec Statement PDF Import, GAP_ANALYSIS.md §3): real on-device
  # PDF text extraction, including password-protected statements — the
  # exact package this screen's own doc-comment already named as the
  # intended choice before this was wired for real. Free community
  # license (Syncfusion's Flutter widgets are free under their Community
  # License for qualifying individuals/small businesses — confirm
  # eligibility before a commercial release; flagged, not a legal
  # determination made here). Verified resolving cleanly against this
  # exact dependency graph with `dart pub get` before landing it.
  syncfusion_flutter_pdf: ^34.2.2
  # F2: real file picking for statement PDF import — named in the original
  # plan's package table alongside share_plus (F6), which isn't added here;
  # F6's own screen already made a documented judgment call to use
  # Clipboard instead. Pinned to the 12.0.0 beta line, not the latest
  # stable 11.x — every file_picker <12.0.0-beta.1 hard-pins win32 ^5.9.0,
  # which conflicts with package_info_plus's win32 ^6.0.1 (win32 only
  # matters for this app's unused Windows desktop target, but pub's
  # resolver still enforces it). Verified resolving cleanly against this
  # exact dependency graph before landing it.
  file_picker: ">=12.0.0-beta.1"
  # F4: parsing an "SMS Backup & Restore"-format XML export — already
  # resolved transitively via syncfusion_flutter_pdf, declared directly
  # here since app/lib/data/sms_backup_xml_parser.dart imports it directly.
  xml: ^7.0.1
  flutter_test:
    sdk: flutter

  # test/flutter_test_config.dart installs an in-memory fake against this
  # interface so TokenStore's flutter_secure_storage calls work under the
  # headless flutter_tester harness — see that file's doc-comment.
  flutter_secure_storage_platform_interface: ^2.0.3

  flutter_lints: ^6.0.0
  # Drives sessionKeepAliveProvider's Timer.periodic without real wall-clock
  # delays — a real-time-delay test (test/app/session_keepalive_test.dart)
  # passed in isolation but flaked under full-suite load from timing drift.
  fake_async: ^1.3.1
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3
  pandapay_lints:
    path: ../packages/pandapay_lints
  alchemist: ^0.14.0
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
