# One-shot production replacement for the explicitly approved pushed branch.
#
# This workflow intentionally does not alter master or the normal master-only
# production workflow. It is armed only by a commit message containing the
# exact marker `[deploy-prod]`, so ordinary future branch pushes run no deploy.
# The target is still the existing production host and database; this is a
# production replacement, not an isolated staging deployment.
name: Deploy approved pushed branch to production

on:
  push:
    branches: [codex/ios-shortcuts-prototype]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prepare-local-backup:
    name: Configure approved local encrypted backup
    if: contains(github.event.head_commit.message, '[prepare-local-backup]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install public backup recipient and local mode
        env:
          HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PUBLIC_RECIPIENT: ${{ secrets.PROD_BACKUP_PUBLIC_RECIPIENT }}
        run: |
          [[ "$PUBLIC_RECIPIENT" =~ ^age1[a-z0-9]{50,80}$ ]]
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$DEPLOY_USER@$HOST" "python3 - '$PUBLIC_RECIPIENT'" < deploy/prepare_local_backup.py

  inspect-backups:
    name: Read-only backup setting check
    if: contains(github.event.head_commit.message, '[inspect-backups]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    steps:
      - name: Check only required backup settings
        env:
          HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$DEPLOY_USER@$HOST" 'python3 -' <<'PY'
          from pathlib import Path
          root = Path('/home/ubuntu/apps/pandapay')
          lines = (root / '.env').read_text().splitlines()
          for key in ('BACKUP_AGE_RECIPIENTS_FILE', 'BACKUP_DESTINATION_A', 'BACKUP_DESTINATION_B'):
              values = [line.split('=', 1)[1].strip().strip('"\x27') for line in lines if line.startswith(key + '=')]
              print(f'{key}: entries={len(values)}, nonempty={bool(values and values[0])}')
              if len(values) == 1 and values[0]:
                  path = Path(values[0])
                  if not path.is_absolute():
                      path = root / path
                  print(f'  referenced path exists={path.exists()}, file={path.is_file()}, directory={path.is_dir()}')
          import json, shutil, subprocess
          for folder in (root / 'backups', Path('/var/backups/pandapay'), Path('/etc/pandapay')):
              print(f'Documented backup location {folder}: exists={folder.is_dir()}')
              if folder.is_dir():
                  matches = sum(1 for pattern in ('*recipients*.txt', '*/*recipients*.txt', 'backup.env', '*/backup.env') for _ in folder.glob(pattern))
                  print(f'  recovery configuration candidates={matches}')
          mounts = subprocess.run(['findmnt', '--json', '-o', 'FSTYPE'], capture_output=True, text=True, check=True)
          def remote_count(nodes):
              return sum(int(n.get('fstype', '').startswith(('nfs', 'cifs', 'fuse.rclone', 'fuse.sshfs'))) + remote_count(n.get('children', [])) for n in nodes)
          print('Remote filesystem mounts=' + str(remote_count(json.loads(mounts.stdout).get('filesystems', []))))
          for tool in ('age', 'pg_dump', 'rclone'):
              print(f'{tool}: installed={shutil.which(tool) is not None}')
          result = subprocess.run(['docker', 'ps', '-aq', '--filter', 'label=com.docker.compose.project=pandapay-prod', '--filter', 'label=com.docker.compose.service=backup'], capture_output=True, text=True)
          print(f'Backup containers: query_ok={result.returncode == 0}, count={len(result.stdout.splitlines())}')
          ids = result.stdout.splitlines()
          if result.returncode == 0 and len(ids) == 1:
              inspected = subprocess.run(['docker', 'inspect', ids[0]], capture_output=True, text=True, check=True)
              container = json.loads(inspected.stdout)[0]
              print('Existing backup container running=' + str(container.get('State', {}).get('Running', False)))
              environment = dict(item.split('=', 1) for item in container.get('Config', {}).get('Env', []) if '=' in item)
              for key in ('BACKUP_AGE_RECIPIENTS_FILE', 'BACKUP_DESTINATION_A', 'BACKUP_DESTINATION_B'):
                  print(f'  container {key}: nonempty={bool(environment.get(key))}')
              for target in ('/run/secrets/backup-recipients.txt', '/offhost/a', '/offhost/b'):
                  mappings = [m for m in container.get('Mounts', []) if m.get('Destination') == target]
                  print(f'  expected mount {target}: count={len(mappings)}')
                  if len(mappings) == 1:
                      print(f'    bind={mappings[0].get("Type") == "bind"}, source_exists={Path(mappings[0]["Source"]).exists()}')
          PY

  verify:
    name: Full Build and test gate
    if: contains(github.event.head_commit.message, '[deploy-prod]')
    uses: ./.github/workflows/build-and-test.yml

  deploy:
    name: Replace production with pushed branch
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy exact branch commit
        env:
          HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
          SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
          NOTIFICATION_SERVICE_URL: ${{ secrets.NOTIFICATION_SERVICE_URL }}
          NOTIFICATION_SERVICE_API_KEY: ${{ secrets.NOTIFICATION_SERVICE_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FALLBACK_API_KEY: ${{ secrets.GEMINI_FALLBACK_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL }}
          AI_WORKER_TOKEN: ${{ secrets.AI_WORKER_TOKEN }}
        run: |
          test -n "$NOTIFICATION_SERVICE_URL"
          test -n "$NOTIFICATION_SERVICE_API_KEY"
          {
            printf 'export NOTIFICATION_SERVICE_URL=%q\n' "$NOTIFICATION_SERVICE_URL"
            printf 'export NOTIFICATION_SERVICE_API_KEY=%q\n' "$NOTIFICATION_SERVICE_API_KEY"
            if [ -n "$GOOGLE_PLACES_API_KEY" ]; then printf 'export GOOGLE_PLACES_API_KEY=%q\n' "$GOOGLE_PLACES_API_KEY"; fi
            if [ -n "$GEMINI_API_KEY" ]; then printf 'export GEMINI_API_KEY=%q\n' "$GEMINI_API_KEY"; fi
            if [ -n "$GEMINI_FALLBACK_API_KEY" ]; then printf 'export GEMINI_FALLBACK_API_KEY=%q\n' "$GEMINI_FALLBACK_API_KEY"; fi
            if [ -n "$GEMINI_MODEL" ]; then printf 'export GEMINI_MODEL=%q\n' "$GEMINI_MODEL"; fi
            if [ -n "$GEMINI_FALLBACK_MODEL" ]; then printf 'export GEMINI_FALLBACK_MODEL=%q\n' "$GEMINI_FALLBACK_MODEL"; fi
            if [ -n "$AI_WORKER_TOKEN" ]; then printf 'export AI_WORKER_TOKEN=%q\n' "$AI_WORKER_TOKEN"; fi
            cat deploy/deploy.sh
          } | ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$HOST" \
            "bash -s -- $SHA $SOURCE_REF"

      - name: Verify production health
        env:
          HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$HOST" \
            'curl -fsS -m 10 http://127.0.0.1:4000/ready && echo && curl -fsS -m 10 http://127.0.0.1:3210/ready'
