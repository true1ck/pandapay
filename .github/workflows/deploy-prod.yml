# Deploys master to the production backend after tests pass.
#
# Before this, production was a COPIED DIRECTORY on the host — not a git
# checkout — so nothing on the server moved when master did. It had drifted
# five migrations behind (stopped at 0035) and nobody could tell by looking,
# because there was no commit on the box to compare against.
#
# The deploy is intentionally boring and idempotent: fetch, hard-reset to the
# pushed commit, run migrations, rebuild, restart, health-check. Running it
# twice on the same commit changes nothing.
#
# TRIGGER: `workflow_run`, not `push`.
# A `push`-triggered job that polls for the test checks races them — the
# deploy starts before the test jobs have registered their checks, and a
# poller then reports "the requested check was never run against this ref"
# and fails. `workflow_run` fires only once "Build and test" has actually
# finished, and carries its conclusion, so the ordering is guaranteed by
# GitHub rather than by waiting and hoping.
#
# Note `workflow_run` always runs the workflow file from the DEFAULT branch,
# so edits to this file only take effect once merged to master.
#
# WHAT IT WILL NOT DO
# -------------------
# It never publishes catalogue cards. Publishing sets `verified_at`, which is
# a human claim that someone checked a card's terms against the issuer — see
# db/seed/0005_publish_demo_cards.sql for why that must not be automated.
# A deploy that silently marked cards "verified" would be the single most
# damaging thing this pipeline could do.
name: Deploy to production

on:
  workflow_run:
    workflows: ["Build and test"]
    types: [completed]
    branches: [master]
  # Manual re-run, e.g. to redeploy the current commit after a server change.
  workflow_dispatch:

# Never let two deploys interleave: they would fight over the same working
# tree and the same migration lock. Queue instead of cancelling — cancelling
# mid-migration is worse than waiting.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and restart backend
    runs-on: ubuntu-latest
    # Deploy only a green build. On workflow_dispatch there is no upstream
    # run to inspect, so that path is allowed through explicitly.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: production
    steps:
      - name: Resolve the commit to deploy
        id: sha
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          # workflow_dispatch has no upstream run; deploy the current master.
          echo "sha=${SHA:-${{ github.sha }}}" >> "$GITHUB_OUTPUT"

      - name: Check out the deploy script at that commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key rather than StrictHostKeyChecking=no: accepting
          # any key would make this pipeline trivially MITM-able, and it
          # holds a key with shell access to production.
          echo "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
          SHA: ${{ steps.sha.outputs.sha }}
          NOTIFICATION_SERVICE_URL: ${{ secrets.NOTIFICATION_SERVICE_URL }}
          NOTIFICATION_SERVICE_API_KEY: ${{ secrets.NOTIFICATION_SERVICE_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FALLBACK_API_KEY: ${{ secrets.GEMINI_FALLBACK_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL }}
          AI_WORKER_TOKEN: ${{ secrets.AI_WORKER_TOKEN }}
        run: |
          test -n "$NOTIFICATION_SERVICE_URL"
          test -n "$NOTIFICATION_SERVICE_API_KEY"
          {
            printf 'export NOTIFICATION_SERVICE_URL=%q\n' "$NOTIFICATION_SERVICE_URL"
            printf 'export NOTIFICATION_SERVICE_API_KEY=%q\n' "$NOTIFICATION_SERVICE_API_KEY"
            if [ -n "$GOOGLE_PLACES_API_KEY" ]; then
              printf 'export GOOGLE_PLACES_API_KEY=%q\n' "$GOOGLE_PLACES_API_KEY"
            fi
            if [ -n "$GEMINI_API_KEY" ]; then
              printf 'export GEMINI_API_KEY=%q\n' "$GEMINI_API_KEY"
            fi
            if [ -n "$GEMINI_FALLBACK_API_KEY" ]; then
              printf 'export GEMINI_FALLBACK_API_KEY=%q\n' "$GEMINI_FALLBACK_API_KEY"
            fi
            if [ -n "$GEMINI_MODEL" ]; then
              printf 'export GEMINI_MODEL=%q\n' "$GEMINI_MODEL"
            fi
            if [ -n "$GEMINI_FALLBACK_MODEL" ]; then
              printf 'export GEMINI_FALLBACK_MODEL=%q\n' "$GEMINI_FALLBACK_MODEL"
            fi
            if [ -n "$AI_WORKER_TOKEN" ]; then
              printf 'export AI_WORKER_TOKEN=%q\n' "$AI_WORKER_TOKEN"
            fi
            cat deploy/deploy.sh
          } | ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$HOST" \
            "bash -s -- $SHA"

      - name: Verify production is healthy
        env:
          HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$HOST" \
            'curl -fsS -m 10 http://127.0.0.1:4000/ready && echo && curl -fsS -m 10 http://127.0.0.1:3210/ready'

      - name: Check Gemini pipeline activity (aggregate only)
        env:
          HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/apps/pandapay
          DBURL="$(sed -n 's/^ADMIN_DATABASE_URL=//p' .env | sed 's/^"//; s/"$//')"
          test -n "$DBURL"
          docker run --rm -i -e U="$DBURL" postgres:17-alpine sh -lc 'psql "$U" -X -qAt -v ON_ERROR_STOP=1' <<'SQL'
          SELECT json_build_object(
            'smsAiQueueEnabled', COALESCE((
              SELECT is_enabled FROM public.feature_flags WHERE key = 'sms_ai_queue_enabled'
            ), false),
            'jobsLast24Hours', (
              SELECT count(*) FROM public.ai_jobs WHERE created_at > now() - interval '24 hours'
            ),
            'jobsByStatusLast24Hours', COALESCE((
              SELECT json_object_agg(status, job_count)
              FROM (
                SELECT status, count(*) AS job_count FROM public.ai_jobs
                WHERE created_at > now() - interval '24 hours' GROUP BY status
              ) AS counts
            ), '{}'::json),
            'providerReservationsLast10Minutes', (
              SELECT count(*) FROM public.ai_provider_reservations
              WHERE created_at > now() - interval '10 minutes'
            ),
            'capacityChecksByOutcomeLast24Hours', COALESCE((
              SELECT json_object_agg(outcome, check_count)
              FROM (
                SELECT outcome, count(*) AS check_count FROM public.ai_provider_capacity_checks
                WHERE checked_at > now() - interval '24 hours' GROUP BY outcome
              ) AS capacity_checks
            ), '{}'::json),
            'successfulResultsLast24Hours', (
              SELECT count(*) FROM public.ai_events
              WHERE event_type = 'result' AND created_at > now() - interval '24 hours'
            ),
            'providerRetriesLast24Hours', (
              SELECT count(*) FROM public.ai_events
              WHERE event_type = 'provider_retry' AND created_at > now() - interval '24 hours'
            ),
            'providerRetriesByReasonLast24Hours', COALESCE((
              SELECT json_object_agg(reason, retry_count)
              FROM (
                SELECT COALESCE(payload->>'reason', 'unspecified') AS reason, count(*) AS retry_count
                FROM public.ai_events
                WHERE event_type = 'provider_retry' AND created_at > now() - interval '24 hours'
                GROUP BY COALESCE(payload->>'reason', 'unspecified')
              ) AS retry_reasons
            ), '{}'::json)
          );
          SQL
          REMOTE

      - name: Smoke test authenticated nearby discovery API
        env:
          HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$HOST" \
            'cd /home/ubuntu/apps/pandapay && docker compose --env-file .env -f docker-compose.prod.yml exec -T api node -' <<'NODE'
          const jwt = require('jsonwebtoken');
          const config = require('./src/config');

          async function main() {
            const secret = Object.values(config.jwtKeys)[0];
            const token = jwt.sign(
              { sub: 'production-smoke-test', role: 'authenticated', token_version: 1 },
              secret,
              { issuer: config.jwtIssuer, audience: config.jwtAudience, expiresIn: '60s' },
            );
            const response = await fetch('http://127.0.0.1:4000/merchants/nearby/google', {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({ lat: 18.5204, lng: 73.8567, radiusM: 2000 }),
              signal: AbortSignal.timeout(25000),
            });
            const payload = await response.json();
            const count = Array.isArray(payload.merchants) ? payload.merchants.length : -1;
            console.log(JSON.stringify({
              http_status: response.status,
              source: payload.source || null,
              merchant_count: count,
              degraded: payload.degraded === true,
              partial: payload.partial === true,
              // The provider's own reason, so a failing gate explains itself
              // (expired Places key, provider outage, blocked egress) instead
              // of only showing a status code.
              error: payload.error || null,
              detail: payload.detail || null,
            }));
            // External Places/OSM availability is not a deployment health
            // signal. Keep the outage visible without marking a healthy API
            // deployment as failed.
            if (response.status === 503
              && payload.error === 'nearby_discovery_unavailable'
              && payload.unavailable === true) {
              console.log('::warning::Nearby providers are unavailable; API health and Gemini checks passed.');
              return;
            }
            if (!response.ok || count < 0
              || !['google_places', 'google_maps', 'openstreetmap_fallback'].includes(payload.source)) {
              process.exitCode = 1;
            }
          }

          main().catch((error) => {
            console.error('Nearby API smoke test failed:', error.name);
            process.exitCode = 1;
          });
          NODE

      - name: Show sanitized API diagnostics
        if: failure()
        env:
          HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$HOST" \
            'cd /home/ubuntu/apps/pandapay && docker compose --env-file .env -f docker-compose.prod.yml logs --tail=80 api'
