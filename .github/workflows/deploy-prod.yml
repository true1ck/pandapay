# Deploys master to the production backend after tests pass.
#
# Before this, production was a COPIED DIRECTORY on the host — not a git
# checkout — so nothing on the server moved when master did. It had drifted
# five migrations behind (stopped at 0035) and nobody could tell by looking,
# because there was no commit on the box to compare against.
#
# The deploy only accepts the exact current master tip, refuses server
# rollback/divergent ancestry, then runs migrations, rebuilds, restarts and
# health-checks. Replaying the same tip is idempotent.
#
# TRIGGER: `workflow_run`, not `push`.
# A `push`-triggered job that polls for the test checks races them — the
# deploy starts before the test jobs have registered their checks, and a
# poller then reports "the requested check was never run against this ref"
# and fails. `workflow_run` fires only once "Build and test" has actually
# finished, and carries its conclusion, so the ordering is guaranteed by
# GitHub rather than by waiting and hoping.
#
# Note `workflow_run` always runs the workflow file from the DEFAULT branch,
# so edits to this file only take effect once merged to master.
# Manual dispatch is also master-only and verifies a successful Build and test
# run for the exact commit through the Actions API before any SSH setup/deploy.
#
# WHAT IT WILL NOT DO
# -------------------
# It never publishes catalogue cards. Publishing sets `verified_at`, which is
# a human claim that someone checked a card's terms against the issuer — see
# db/seed/0005_publish_demo_cards.sql for why that must not be automated.
# A deploy that silently marked cards "verified" would be the single most
# damaging thing this pipeline could do.
name: Deploy to production

on:
  workflow_run:
    workflows: ["Build and test"]
    types: [completed]
    branches: [master, latest-dev]
  # latest-dev deploys itself on every push. `workflow_run` cannot do this:
  # GitHub always runs a workflow_run workflow from the DEFAULT branch's copy
  # of the file, so a latest-dev edit never fires it. A `push` trigger does use
  # the pushed branch's own file, so this run first calls "Build and test" as a
  # reusable workflow (the `test` job) and `deploy` waits for it to pass.
  push:
    branches: [latest-dev]
  # Manual run, e.g. to redeploy the current commit after a server change, or
  # to ship latest-dev: `gh workflow run deploy-prod.yml --ref latest-dev`.
  # Only master and latest-dev are accepted (see the first step below).
  workflow_dispatch:

# Never let two deploys interleave: they would fight over the same working
# tree and the same migration lock. Queue instead of cancelling — cancelling
# mid-migration is worse than waiting.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  # Only so the called Build and test workflow's `images` job can push to GHCR.
  packages: write

jobs:
  # Push to latest-dev only: run the full test gate inside this workflow. On
  # the other triggers the tests already ran (or are checked via the API
  # below), so this job is skipped.
  test:
    name: Build and test (latest-dev push)
    if: github.event_name == 'push'
    uses: ./.github/workflows/build-and-test.yml
    secrets: inherit
    permissions:
      actions: read
      contents: read
      packages: write

  deploy:
    name: Migrate and restart backend
    runs-on: ubuntu-latest
    needs: [test]
    # `!cancelled()` so a skipped `test` job (every non-push trigger) does not
    # skip the deploy. A push deploys only if its own test run succeeded;
    # manual dispatch must find a successful exact-SHA Build and test run.
    if: >-
      ${{ !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'push' && needs.test.result == 'success')
      ) }}
    environment: production
    steps:
      - name: Resolve the commit to deploy
        id: sha
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # Production deploys only from an allow-listed branch. The branch is
          # the one the tested commit lives on: the dispatch ref, or the
          # branch of the Build and test run that triggered this workflow.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$GITHUB_EVENT_NAME" = push ]; then
            DEPLOY_BRANCH="${GITHUB_REF#refs/heads/}"
            [ "$GITHUB_REF" = "refs/heads/$DEPLOY_BRANCH" ] || {
              echo 'FATAL: production can only be dispatched from a branch' >&2
              exit 1
            }
          else
            DEPLOY_BRANCH="$RUN_BRANCH"
          fi
          case "$DEPLOY_BRANCH" in
            master|latest-dev) ;;
            *)
              echo "FATAL: refusing to deploy branch '$DEPLOY_BRANCH'; only master and latest-dev are allowed" >&2
              exit 1
              ;;
          esac
          [[ "$DEPLOY_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || {
            echo 'FATAL: deployment event did not provide a full commit SHA' >&2
            exit 1
          }
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$DEPLOY_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Verify exact commit passed Build and test
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
          DEPLOY_BRANCH: ${{ steps.sha.outputs.branch }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # Build and test ran as the `test` job of this very run (the
            # deploy job's `needs` + `if` already require it to have passed),
            # so it has no separate run for the API to find.
            echo "Build and test passed in this run for $SHA on $DEPLOY_BRANCH."
          elif [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID")"
            jq -e --arg sha "$SHA" --arg branch "$DEPLOY_BRANCH" '
              .head_sha == $sha and
              .head_branch == $branch and
              .conclusion == "success" and
              .path == ".github/workflows/build-and-test.yml"
            ' <<< "$run_json" >/dev/null || {
              echo "FATAL: triggering Build and test run does not verify this $DEPLOY_BRANCH commit" >&2
              exit 1
            }
          else
            runs_json="$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/workflows/build-and-test.yml/runs?head_sha=$SHA&status=success&per_page=100")"
            matching_runs="$(jq -r --arg sha "$SHA" --arg branch "$DEPLOY_BRANCH" '
              [.[].workflow_runs[] |
                select(.head_sha == $sha and .head_branch == $branch and .conclusion == "success") |
                .id] | length
            ' <<< "$runs_json")"
            [ "$matching_runs" -gt 0 ] || {
              echo "FATAL: this exact $DEPLOY_BRANCH commit has no successful Build and test run" >&2
              exit 1
            }
          fi

      - name: Check out the deploy script at that commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key rather than StrictHostKeyChecking=no: accepting
          # any key would make this pipeline trivially MITM-able, and it
          # holds a key with shell access to production.
          echo "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Confirm the tested target is still the current branch tip
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
          DEPLOY_BRANCH: ${{ steps.sha.outputs.branch }}
        run: |
          set -euo pipefail
          current_tip_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEPLOY_BRANCH" --jq '.object.sha')"
          if [ "$current_tip_sha" != "$SHA" ]; then
            echo "FATAL: tested target is no longer the current $DEPLOY_BRANCH tip; refusing a stale deploy." >&2
            exit 1
          fi

      - name: Deploy
        env:
          HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
          SHA: ${{ steps.sha.outputs.sha }}
          DEPLOY_BRANCH: ${{ steps.sha.outputs.branch }}
          NOTIFICATION_SERVICE_URL: ${{ secrets.NOTIFICATION_SERVICE_URL }}
          NOTIFICATION_SERVICE_API_KEY: ${{ secrets.NOTIFICATION_SERVICE_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          test -n "$NOTIFICATION_SERVICE_URL"
          test -n "$NOTIFICATION_SERVICE_API_KEY"
          {
            printf 'export NOTIFICATION_SERVICE_URL=%q\n' "$NOTIFICATION_SERVICE_URL"
            printf 'export NOTIFICATION_SERVICE_API_KEY=%q\n' "$NOTIFICATION_SERVICE_API_KEY"
            if [ -n "$GOOGLE_PLACES_API_KEY" ]; then
              printf 'export GOOGLE_PLACES_API_KEY=%q\n' "$GOOGLE_PLACES_API_KEY"
            fi
            cat deploy/deploy.sh
          } | bash deploy/ssh_script.sh "$DEPLOY_USER@$HOST" "$SHA" "$DEPLOY_BRANCH"

      - name: Verify production is healthy
        env:
          HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$HOST" \
            'curl -fsS -m 10 http://127.0.0.1:4000/ready && echo && curl -fsS -m 10 http://127.0.0.1:3210/ready'

      - name: Smoke test authenticated nearby discovery API
        env:
          HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$HOST" \
            'cd /home/ubuntu/apps/pandapay && docker compose --env-file .env -f docker-compose.prod.yml exec -T api node -' <<'NODE'
          const jwt = require('jsonwebtoken');
          const config = require('./src/config');

          async function main() {
            const secret = Object.values(config.jwtKeys)[0];
            const token = jwt.sign(
              { sub: 'production-smoke-test', role: 'authenticated', token_version: 1 },
              secret,
              { issuer: config.jwtIssuer, audience: config.jwtAudience, expiresIn: '60s' },
            );
            const response = await fetch('http://127.0.0.1:4000/merchants/nearby/google', {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({ lat: 18.5204, lng: 73.8567, radiusM: 2000 }),
              signal: AbortSignal.timeout(25000),
            });
            const payload = await response.json();
            const count = Array.isArray(payload.merchants) ? payload.merchants.length : -1;
            console.log(JSON.stringify({
              http_status: response.status,
              source: payload.source || null,
              merchant_count: count,
              degraded: payload.degraded === true,
              partial: payload.partial === true,
              error: payload.error || null,
              detail: payload.detail || null,
            }));
            // External Places/OSM availability is not a deployment health
            // signal. Keep the outage visible without marking a healthy API
            // deployment as failed.
            if (response.status === 503
              && payload.error === 'nearby_discovery_unavailable'
              && payload.unavailable === true) {
              console.log('::warning::Nearby providers are unavailable; API health checks passed.');
              return;
            }
            if (!response.ok || count < 0
              || !['google_places', 'google_maps', 'openstreetmap_fallback'].includes(payload.source)) {
              process.exitCode = 1;
            }
          }

          main().catch((error) => {
            console.error('Nearby API smoke test failed:', error.name);
            process.exitCode = 1;
          });
          NODE

      - name: Smoke test anonymous auth denial
        env:
          HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$HOST" \
            'set -eu
            api_status="$(curl -sS -o /dev/null -w "%{http_code}" -m 10 -X POST \
              -H "content-type: application/json" --data "{}" \
              http://127.0.0.1:4000/merchants/nearby/google)"
            auth_status="$(curl -sS -o /dev/null -w "%{http_code}" -m 10 \
              http://127.0.0.1:3210/users/me)"
            printf "anonymous API denial: %s; anonymous auth denial: %s\\n" "$api_status" "$auth_status"
            [ "$api_status" = 401 ] && [ "$auth_status" = 401 ]'

      - name: Show sanitized Google Places diagnostic
        if: success()
        env:
          HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$HOST" \
            'cd /home/ubuntu/apps/pandapay && docker compose --env-file .env -f docker-compose.prod.yml logs --tail=100 api | grep "Google Places failed:" | tail -n 1 || true'

      - name: Show sanitized API diagnostics
        if: failure()
        env:
          HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$HOST" \
            'cd /home/ubuntu/apps/pandapay && docker compose --env-file .env -f docker-compose.prod.yml logs --tail=80 api'
