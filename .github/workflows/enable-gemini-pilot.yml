name: Enable Gemini 1% pilot

on:
  workflow_dispatch:
    inputs:
      enable_pilot:
        description: Explicitly enable the 1% SMS AI pilot
        type: boolean
        required: false
        default: false
      run_live_provider_probe:
        description: Send one synthetic, non-persistent Gemini request to verify provider connectivity
        type: boolean
        required: false
        default: false
      check_gemini_model_access:
        description: Check model access using the configured server key without generating content
        type: boolean
        required: false
        default: false
      probe_model:
        description: Model to inspect in the synthetic provider probe
        type: choice
        options:
          - gemini-3.8-flash
          - gemini-3.7-flash
          - gemini-3.6-flash
          - gemini-3.5-flash
          - gemini-2.5-flash
        required: false
        default: gemini-3.8-flash
      run_minimal_generation_probe:
        description: Send a tiny synthetic request capped at 32 output tokens
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  enable-pilot:
    name: Enable SMS AI pilot
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Set 1% SMS AI rollout
        if: ${{ inputs.enable_pilot }}
        env:
          HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/apps/pandapay
          DBURL="$(sed -n 's/^ADMIN_DATABASE_URL=//p' .env | sed 's/^"//; s/"$//')"
          test -n "$DBURL"
          docker run --rm -i -e U="$DBURL" postgres:17-alpine sh -lc 'psql "$U" -X -qAt -v ON_ERROR_STOP=1' <<'SQL'
          BEGIN;
          INSERT INTO public.feature_flags (key, is_enabled, rollout_percent, description)
          VALUES ('sms_ai_queue_enabled', true, 1, 'Gemini SMS classification pilot')
          ON CONFLICT (key) DO UPDATE SET
            is_enabled = EXCLUDED.is_enabled,
            rollout_percent = EXCLUDED.rollout_percent,
            description = EXCLUDED.description,
            updated_at = now();
          SELECT json_build_object(
            'pilot', (
              SELECT json_build_object(
                'enabled', is_enabled,
                'rolloutPercent', rollout_percent,
                'updatedAt', updated_at
              ) FROM public.feature_flags WHERE key = 'sms_ai_queue_enabled'
            ),
            'jobsLast24Hours', (
              SELECT count(*) FROM public.ai_jobs WHERE created_at > now() - interval '24 hours'
            ),
            'jobsByStatusLast24Hours', COALESCE((
              SELECT json_object_agg(status, job_count)
              FROM (
                SELECT status, count(*) AS job_count FROM public.ai_jobs
                WHERE created_at > now() - interval '24 hours' GROUP BY status
              ) AS counts
            ), '{}'::json),
            'providerReservationsLast24Hours', (
              SELECT count(*) FROM public.ai_provider_reservations
              WHERE created_at > now() - interval '24 hours'
            ),
            'successfulResultsLast24Hours', (
              SELECT count(*) FROM public.ai_events
              WHERE event_type = 'result' AND created_at > now() - interval '24 hours'
            ),
            'providerRetriesLast24Hours', (
              SELECT count(*) FROM public.ai_events
              WHERE event_type = 'provider_retry' AND created_at > now() - interval '24 hours'
            )
          );
          COMMIT;
          SQL
          REMOTE

      - name: Probe Gemini with a synthetic fixture
        if: ${{ inputs.run_live_provider_probe || inputs.check_gemini_model_access || inputs.run_minimal_generation_probe }}
        env:
          HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
          RUN_LIVE_PROVIDER_PROBE: ${{ inputs.run_live_provider_probe }}
          RUN_MINIMAL_GENERATION_PROBE: ${{ inputs.run_minimal_generation_probe }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/apps/pandapay
          docker compose --profile sms-ai --env-file .env -f docker-compose.prod.yml exec -T \
            -e RUN_LIVE_PROVIDER_PROBE='${{ inputs.run_live_provider_probe }}' \
            -e RUN_MINIMAL_GENERATION_PROBE='${{ inputs.run_minimal_generation_probe }}' \
            -e PROBE_GEMINI_MODEL='${{ inputs.probe_model }}' gemini-worker node - <<'NODE'
          (async () => {
          const { GeminiProvider } = require('./src/gemini_worker');

          const hostProbeStarted = Date.now();
          let hostProbe;
          try {
            const response = await fetch('https://generativelanguage.googleapis.com/', {
              signal: AbortSignal.timeout(6000),
            });
            hostProbe = { reachable: true, status: response.status };
            await response.body?.cancel();
          } catch (error) {
            const cause = error.cause || error;
            hostProbe = {
              reachable: false,
              errorType: cause.name || error.name,
              errorCode: cause.code || error.code || null,
            };
          }
          console.log(JSON.stringify({
            providerHost: hostProbe,
            elapsedMs: Date.now() - hostProbeStarted,
          }));
          if (!hostProbe.reachable) {
            process.exitCode = 2;
            return;
          }

          const model = process.env.PROBE_GEMINI_MODEL || process.env.GEMINI_MODEL || 'gemini-3.8-flash';
          let modelAccess;
          try {
            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}`,
              {
                headers: { 'x-goog-api-key': process.env.GEMINI_API_KEY },
                signal: AbortSignal.timeout(8000),
              },
            );
            const metadata = response.ok ? await response.json() : {};
            modelAccess = {
              success: response.ok && metadata.supportedGenerationMethods?.includes('generateContent') === true,
              status: response.status,
              supportsGenerateContent: metadata.supportedGenerationMethods?.includes('generateContent') === true,
            };
          } catch (error) {
            const cause = error.cause || error;
            modelAccess = {
              success: false,
              errorType: cause.name || error.name,
              errorCode: cause.code || error.code || null,
            };
          }
          console.log(JSON.stringify({ modelAccess }));
          if (!modelAccess.success) {
            process.exitCode = 1;
            return;
          }

          const listStartedAt = Date.now();
          try {
            const response = await fetch(
              'https://generativelanguage.googleapis.com/v1beta/models',
              {
                headers: { 'x-goog-api-key': process.env.GEMINI_API_KEY },
                signal: AbortSignal.timeout(8000),
              },
            );
            const data = response.ok ? await response.json() : {};
            const models = Array.isArray(data.models) ? data.models : [];
            console.log(JSON.stringify({
              availableFlashModels: {
                status: response.status,
                names: models
                  .filter((item) => item.supportedGenerationMethods?.includes('generateContent') && /flash/i.test(item.name || ''))
                  .map((item) => item.name)
                  .slice(0, 20),
                elapsedMs: Date.now() - listStartedAt,
              },
            }));
          } catch (error) {
            const cause = error.cause || error;
            console.log(JSON.stringify({
              availableFlashModels: {
                errorType: cause.name || error.name,
                errorCode: cause.code || error.code || null,
                elapsedMs: Date.now() - listStartedAt,
              },
            }));
          }

          // Empty contents should be rejected before generation. Using the
          // configured key verifies generateContent authentication/routing
          // without asking the model to run or spending output tokens.
          const postPathStarted = Date.now();
          try {
            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,
              {
                method: 'POST',
                headers: {
                  'content-type': 'application/json',
                  'x-goog-api-key': process.env.GEMINI_API_KEY,
                },
                body: JSON.stringify({ contents: [] }),
                signal: AbortSignal.timeout(8000),
              },
            );
            console.log(JSON.stringify({
              authenticatedValidationPost: { responded: true, status: response.status, elapsedMs: Date.now() - postPathStarted },
            }));
            await response.body?.cancel();
          } catch (error) {
            const cause = error.cause || error;
            console.log(JSON.stringify({
              authenticatedValidationPost: {
                responded: false,
                errorType: cause.name || error.name,
                errorCode: cause.code || error.code || null,
                elapsedMs: Date.now() - postPathStarted,
              },
            }));
            process.exitCode = 1;
            return;
          }

          if (process.env.RUN_MINIMAL_GENERATION_PROBE === 'true') {
            const startedAt = Date.now();
            try {
              const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,
                {
                  method: 'POST',
                  headers: {
                    'content-type': 'application/json',
                    'x-goog-api-key': process.env.GEMINI_API_KEY,
                  },
                  body: JSON.stringify({
                    contents: [{ role: 'user', parts: [{ text: 'Reply with OK.' }] }],
                    generationConfig: { maxOutputTokens: 8 },
                  }),
                  signal: AbortSignal.timeout(20000),
                },
              );
              let candidateCount = 0;
              try {
                const data = await response.json();
                candidateCount = Array.isArray(data.candidates) ? data.candidates.length : 0;
              } catch (_) {}
              console.log(JSON.stringify({
                minimalGeneration: {
                  success: response.ok && candidateCount > 0,
                  status: response.status,
                  candidateCount,
                  elapsedMs: Date.now() - startedAt,
                },
              }));
              if (!response.ok || candidateCount === 0) {
                process.exitCode = 1;
                return;
              }
            } catch (error) {
              const cause = error.cause || error;
              console.log(JSON.stringify({
                minimalGeneration: {
                  success: false,
                  errorType: cause.name || error.name,
                  errorCode: cause.code || error.code || null,
                  elapsedMs: Date.now() - startedAt,
                },
              }));
              process.exitCode = 1;
              return;
            }
          }
          if (process.env.RUN_LIVE_PROVIDER_PROBE !== 'true') return;

          const payload = {
            sender: 'SYNTHETIC_TEST',
            occurredAt: '2026-10-24T00:00:00.000Z',
            body: 'Synthetic fixture only: HDFC Bank A/c XX1234 available balance Rs 1234.50 as of 24 October 2026.',
          };

          const nativeFetch = globalThis.fetch;
          let transportError = null;
          const startedAt = Date.now();
          const provider = new GeminiProvider({
            model,
            fetchImpl: async (url, options) => {
              try {
                const { signal: _providerTimeout, ...requestOptions } = options;
                // Diagnostic only: see whether Gemini completes just beyond the
                // production 20-second request timeout.
                return await nativeFetch(url, {
                  ...requestOptions,
                  signal: AbortSignal.timeout(60000),
                });
              } catch (error) {
                const cause = error.cause || error;
                transportError = { name: cause.name || error.name, code: cause.code || error.code || null };
                throw error;
              }
            },
          });

          provider.classify({ payload }).then((facts) => {
            const smsFacts = require('./src/sms_facts');
            const { verifyModelFacts } = require('./src/ai_fact_evidence');
            const contract = smsFacts.validateFactSet(facts);
            const evidence = verifyModelFacts(facts, payload);
            const valid = contract.valid && evidence.valid;
            console.log(JSON.stringify({
              provider: 'gemini',
              success: valid,
              factCount: facts.length,
              contractValid: contract.valid,
              contractErrors: contract.errors.slice(0, 5),
              evidenceValid: evidence.valid,
              evidenceErrors: evidence.errors.slice(0, 5),
              elapsedMs: Date.now() - startedAt,
            }));
            if (!valid) process.exitCode = 1;
          }).catch((error) => {
            console.log(JSON.stringify({
              provider: 'gemini',
              success: false,
              errorType: error.name,
              status: error.status || null,
              retryable: error.retryable === true,
              transportError,
              elapsedMs: Date.now() - startedAt,
            }));
            process.exitCode = 1;
          });
          })().catch((error) => {
            console.log(JSON.stringify({ probe: 'failed', errorType: error.name }));
            process.exitCode = 1;
          });
          NODE
          REMOTE
