# Plan Phase 0.2 — the build gate that did not exist.
#
# Before this the repo had exactly one workflow (the anonymization audit), so
# nothing on any branch ever ran `flutter analyze`, `flutter test`, the domain
# package's tests, or the API's tests. Every one of those was run by hand, and
# a duplicate top-level `const` that made `api/src/index.js` fail to parse at
# all still shipped — because the API's unit tests import individual modules
# and never load the entry point. `npm test` now runs `node --check` on every
# source file first, and this workflow makes that automatic.
#
# It also builds both container images and, on master, pushes them to GHCR —
# the registry decision deploy/DEPLOY.md's own header used to call an open
# owner action. `docker compose -f docker-compose.prod.yml pull` on the
# deploy host then always gets exactly the image this workflow tested.

name: Build and test

on:
  push:
    # prod is deliberately absent: a prod push runs this workflow
    # through deploy-prod.yml (workflow_call) so the deploy can wait on it.
    # Listing it here too would run every test twice.
    branches: [main, master]
  pull_request:
  workflow_call:

# A new push to the same branch makes an in-flight run obsolete; cancelling it
# keeps the queue honest rather than burning runners on a superseded commit.
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-recovery:
    name: Security migrations and encrypted PostgreSQL recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install recovery test tools and auth driver
        run: |
          # The runner's DNS occasionally cannot resolve the Ubuntu mirrors, which
          # failed this step (and blocked every deploy) with no retry. Retry with a
          # pause, and let apt retry individual downloads too.
          for attempt in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y postgresql postgresql-contrib age; then break; fi
            [ "$attempt" = 5 ] && { echo 'apt failed after 5 attempts' >&2; exit 1; }
            echo "apt attempt $attempt failed; retrying in 30s" >&2; sleep 30
          done
          ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1 >> "$GITHUB_PATH"
          npm ci --omit=dev --prefix auth
          npm ci --prefix api
      - name: Private administrator boundary and signed WebAuthn integration
        run: bash scripts/test_private_admin.sh
      - name: Migration and backup failure tests
        run: |
          node --test db/tests/*.test.js
          python3 -m unittest discover -s db/tests -p '*_test.py' -v
          python3 -m unittest discover -s deploy/tests -p 'test_*.py' -v
      - name: Synthetic encrypted database move rehearsal
        run: python3 db/tests/security_recovery_integration.py
      - name: Remaining security PostgreSQL role regressions
        run: |
          npm ci --omit=dev --prefix api
          LIFECYCLE_JOURNAL_AGE_TEST_BIN="$(command -v age)" python3 db/tests/security_remaining_postgres.py
          LIFECYCLE_JOURNAL_AGE_TEST_BIN="$(command -v age)" node api/test/account_lifecycle_journal_age.js

  api:
    name: API and auth (Node)
    runs-on: ubuntu-latest
    services:
      foreign-payments-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: foreign_fixture_only
          POSTGRES_DB: pandapay_fx_test
        ports:
          - 5548:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pandapay_fx_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install api dependencies
        working-directory: api
        run: npm ci

      # Runs `node --check` on every source file, then the unit tests.
      - name: Test api
        working-directory: api
        env:
          PANDAPAY_FX_FIXTURE_URL: postgresql://postgres:foreign_fixture_only@127.0.0.1:5548/pandapay_fx_test
          # src/auth.js throws at require-time without this, by design — it
          # refuses to start with an unset signing secret rather than silently
          # accepting unsigned tokens. A CI-only value satisfies the check.
          JWT_ACCESS_SECRET: ci_only_not_a_real_secret
        run: npm test

      - name: Test SMS v2 server modules
        working-directory: api
        env:
          JWT_ACCESS_SECRET: ci_only_not_a_real_secret
        run: node --test --test-concurrency=1 test/sms_v2/*.test.js

      - name: Install auth dependencies
        working-directory: auth
        run: npm ci

      - name: Test auth
        working-directory: auth
        env:
          NODE_ENV: test
        run: npm test

      - name: Syntax-check auth
        working-directory: auth
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "auth/: all source files parse"

  # `npm test` skips every suite that needs a real database (their URL
  # variables are unset there, by design). This job gives them one: a
  # throwaway PostgreSQL service, the product migrations and role setup applied
  # by db/scripts/product_migrate.js, then the API and SMS v2 *_pg suites
  # (email import included), db/tests/*.sql, and the *_postgres.js fixtures no
  # other job runs. scripts/test_postgres_suites.sh lists them; it fails if a
  # node suite skips anything. The private-admin and remaining-security
  # fixtures stay in the security-recovery job.
  postgres-suites:
    name: PostgreSQL-backed suites
    runs-on: ubuntu-latest
    # The fixtures refuse a database server whose own address is not loopback,
    # and a service container reports its container address. So the server is
    # a throwaway cluster on this runner, listening on 127.0.0.1 only.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # psql runs the role setup and SQL tests; initdb/pg_ctl are for the
      # fixtures that start their own short-lived cluster.
      - name: Install PostgreSQL tools and dependencies
        run: |
          # The runner's DNS occasionally cannot resolve the Ubuntu mirrors, which
          # failed this step (and blocked every deploy) with no retry. Retry with a
          # pause, and let apt retry individual downloads too.
          for attempt in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y postgresql postgresql-contrib; then break; fi
            [ "$attempt" = 5 ] && { echo 'apt failed after 5 attempts' >&2; exit 1; }
            echo "apt attempt $attempt failed; retrying in 30s" >&2; sleep 30
          done
          ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1 >> "$GITHUB_PATH"
          npm ci --prefix api
          npm ci --omit=dev --prefix auth

      # Trust authentication: the delivery fixture logs in as roles it creates
      # without a password, and this cluster exists only for this job.
      - name: Start a throwaway loopback PostgreSQL cluster
        run: |
          pgdata="$RUNNER_TEMP/pg-suites"
          initdb -D "$pgdata" -U postgres -A trust --no-locale --encoding=UTF8 > /dev/null
          pg_ctl -D "$pgdata" -l "$RUNNER_TEMP/pg-suites.log" \
            -o "-c listen_addresses=127.0.0.1 -p 5549 -k $RUNNER_TEMP" -w start
          psql "postgresql://postgres@127.0.0.1:5549/postgres" -XAtc 'select version()'

      - name: PostgreSQL suites
        env:
          PG_SUITES_ADMIN_URL: postgresql://postgres:ci_only_pg_suites@127.0.0.1:5549
        run: bash scripts/test_postgres_suites.sh

  flutter:
    name: App, console and domain (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Domain package tests
        working-directory: packages/pandapay_domain
        run: |
          dart pub get
          dart test

      # SMS pipeline v2 contracts (WP-01): the Dart and Node validators must
      # agree on every fixture in contracts/sms/v2. The Dart suite already ran
      # above as part of `dart test`; it is repeated by name so a contracts
      # failure is easy to find, followed by the Node suite.
      - name: Contracts
        run: |
          (cd packages/pandapay_domain && dart test test/sms_v2/contract_fixtures_test.dart)
          (cd api && npm ci && node --test test/sms_v2/contracts.test.js)

      - name: SMS v2 rule parity and complete golden pipeline
        run: |
          cd tools/sms_rules_cli
          dart pub get
          node test/regex_parity.mjs ../../rules/sms/v2
          dart run tool/check_pipeline.dart --baseline ../sms_golden/reports/latest.json

      - name: App dependencies
        working-directory: app
        run: flutter pub get

      - name: App analyze
        working-directory: app
        run: |
          # Errors and warnings remain build-blocking. Informational analyzer
          # hints vary across stable Flutter releases and must not prevent a
          # production deployment when the source has no actionable issue.
          flutter analyze --no-fatal-infos

      - name: Console analyze
        working-directory: console
        run: |
          flutter pub get
          dart run tool/copy_golden.dart
          git diff --exit-code -- assets/sms_golden/
          flutter analyze

      - name: Console session regressions and CSP bundle
        working-directory: console
        run: |
          flutter test --no-pub
          flutter build web --release --no-pub --csp --no-web-resources-cdn

  # The full app suite used to run as one serial ~14 minute step. It is now
  # split across shards that run in parallel on separate runners. Each shard is
  # its own `flutter test` process with `--concurrency=1`, so the reason the
  # suite was serial (several widget suites replace global Riverpod/plugin
  # overrides, and one file must not leak state into another on a shared test
  # VM) still holds: no two test files ever share a VM, only different shards
  # run at the same time, on different machines.
  app-test:
    name: App tests (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: App dependencies
        working-directory: app
        run: flutter pub get

      - name: App test
        working-directory: app
        run: flutter test --no-pub --concurrency=1 --total-shards=8 --shard-index=$(( ${{ matrix.shard }} - 1 ))

  # The release bundle build is ~9 minutes and does not depend on the tests,
  # so it runs alongside them instead of after them.
  app-bundle:
    name: Prod bundle and merged manifest check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/**/gradle-wrapper.properties', 'app/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: App dependencies
        working-directory: app
        run: flutter pub get

      # A fresh runner has never built a debug APK and may have no fallback
      # keystore. This bundle is a manifest check, never a published release.
      - name: Prepare ephemeral CI signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storetype JKS \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      # Verify required SMS permissions and the storage denylist in the
      # packaged prod manifest, including permissions merged by plugins.
      #
      # `--flavor prod` needs the dart-defines Env.assertReleaseConfigured
      # demands; CI-only placeholder URLs satisfy it without pointing at
      # anything real.
      - name: Build prod bundle and check its merged manifest
        working-directory: app
        run: |
          flutter build appbundle --release --no-pub --flavor prod \
            --obfuscate --split-debug-info=build/debug-info \
            --dart-define=PANDAPAY_ENV=prod \
            --dart-define=PANDAPAY_API_BASE_URL=https://api.invalid \
            --dart-define=PANDAPAY_AUTH_BASE_URL=https://auth.invalid
          ../scripts/check_prod_manifest.sh

      # Symbol map for the bundle above. Without it a crash from the matching
      # release build cannot be symbolicated; see docs/release/symbolication.md.
      # It holds code names only, no user data, but keep the retention finite.
      - name: Keep debug-info for symbolication
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-info-${{ github.sha }}
          path: app/build/debug-info/
          if-no-files-found: error
          retention-days: 90

  images:
    name: Container images
    runs-on: ubuntu-latest
    # Without this, GitHub Actions runs `images` in parallel with `api`/
    # `flutter`, independent of their outcome — a code review caught that a
    # red test run could still publish `:latest` to GHCR, which is exactly
    # the guarantee deploy/DEPLOY.md claims this workflow provides ("pulling
    # :latest always gets exactly the image this workflow tested"). The build
    # itself (push: false path, PR runs) still runs unconditionally — only
    # the push gate needs every validation, including the integration smoke
    # test and anonymization audit, before publishing a deployable image.
    needs: [api, flutter, app-test, app-bundle, smoke, anonymization-audit, security-recovery]
    # A prod push is a production deploy, and the production host builds
    # its own images from source (deploy/deploy.sh), never pulling these. Skip
    # this job there so the deploy does not wait an extra minute on an image
    # nothing uses. master pushes and pull requests still build (and on master
    # push) these images exactly as before.
    if: github.ref != 'refs/heads/prod'
    # Needed to push to GHCR under GITHUB_TOKEN — this repo's default token
    # permissions may be read-only, so this is explicit rather than assumed.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Pushed only on master, never on a pull_request build from a fork —
      # forks don't get GITHUB_TOKEN write access anyway, but this also keeps
      # PR runs from publishing untested images under a real tag.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` + the commit sha, not a floating tag alone — deploy/DEPLOY.md
      # pins a specific sha when it matters, `latest` is for the common case.
      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ github.ref == 'refs/heads/master' && format('ghcr.io/{0}/pandapay-api:latest', github.repository_owner) || '' }}
            ghcr.io/${{ github.repository_owner }}/pandapay-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push auth image
        uses: docker/build-push-action@v6
        with:
          context: ./auth
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ github.ref == 'refs/heads/master' && format('ghcr.io/{0}/pandapay-auth:latest', github.repository_owner) || '' }}
            ghcr.io/${{ github.repository_owner }}/pandapay-auth:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Brings up the real stack — both databases, both services, migrations
      # and demo seeds — and drives it over HTTP.
      #
      # This job exists because unit tests structurally cannot catch the class
      # of bug that actually shipped here. `POST /transactions` returned 201
      # while never recording what the transaction earned, so every "rewards
      # this month" figure was zero; `GET /catalogue` returned 200 with an
      # empty list on a fresh stack, so the app had nothing to rank. Both are
      # integration failures between services and data, and both are asserted
      # on VALUES rather than status codes in scripts/smoke_test.py.
      - name: Start the stack
        run: |
          docker compose up -d --wait --wait-timeout 180
          docker compose ps

      # The second role-setup pass must preserve the promotions grants and
      # profile restrictions. Both scripts use a transaction and roll back all
      # synthetic referral/credit data before the HTTP smoke suite runs.
      - name: Verify referral schema permissions and disabled defaults
        run: docker compose exec -T db psql -U postgres -d pandapay -v ON_ERROR_STOP=1 -f - < db/tests/20261021130000_referral_promotions_permissions_test.sql

      - name: Verify referral activation, Bamboo and idempotent spins
        run: docker compose exec -T db psql -U postgres -d pandapay -v ON_ERROR_STOP=1 -f - < db/tests/20261021133000_referral_journey_test.sql

      - name: Verify isolated reward worker leases and retries
        run: docker compose exec -T db psql -U postgres -d pandapay -v ON_ERROR_STOP=1 -f - < db/tests/20261021140000_rewards_worker_outbox_test.sql

      - name: Verify shared SMS category learning thresholds and consent
        run: docker compose exec -T db psql -U postgres -d pandapay -v ON_ERROR_STOP=1 -f - < db/tests/20261027153000_sms_shared_category_rules_test.sql

      - name: Verify SMS v2 core tables, RLS and transaction columns
        run: docker compose exec -T db psql -U postgres -d pandapay -v ON_ERROR_STOP=1 -f - < db/tests/20261111120000_sms_v2_core_test.sql

      - name: Verify card rewards v2 schema, v1 feed compatibility and RLS
        run: docker compose exec -T db psql -U postgres -d pandapay -v ON_ERROR_STOP=1 -f - < db/tests/20261105120000_card_rules_v2_test.sql

      # The deploy runs the role script as an admin that has CREATEROLE but
      # not SUPERUSER. Restating a role's SUPERUSER attribute is refused for
      # that admin ("permission denied to alter role"), so the second and
      # every later deploy failed before the containers were rebuilt. Run the
      # script twice as such an admin: both passes must succeed.
      - name: Verify the app role setup is safe for a non-superuser deploy admin
        run: |
          docker compose exec -T db psql -U postgres -d pandapay -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'deploy_admin_ci') THEN
              CREATE ROLE deploy_admin_ci LOGIN PASSWORD 'deploy_admin_ci_pw' CREATEROLE;
            END IF;
          END $$;
          SQL
          docker compose exec -T db psql -U postgres -d pandapay -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE role_setup_ci OWNER deploy_admin_ci'
          docker compose exec -T \
            -e PGPASSWORD=deploy_admin_ci_pw \
            db psql -U deploy_admin_ci -d role_setup_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.role_setup_fixture (id integer PRIMARY KEY);
          CREATE SCHEMA pandapay;
          CREATE TABLE pandapay.role_setup_fixture (id integer PRIMARY KEY);
          SQL
          for pass in 1 2; do
            docker compose exec -T \
              -e PGPASSWORD=deploy_admin_ci_pw \
              -e APP_USER_PASSWORD=app_user_ci_pw \
              -e REWARD_WORKER_DB_PASSWORD=reward_worker_ci_pw \
              -e SMS_LEARNING_WORKER_DB_PASSWORD=sms_learning_worker_ci_pw \
              -e SMS_AI_WORKER_DB_PASSWORD=sms_ai_worker_ci_pw \
              db psql -U deploy_admin_ci -d role_setup_ci -v ON_ERROR_STOP=1 \
              -f - < db/setup_app_role.sql
            echo "role setup pass $pass ok"
          done
          # The roles must remain locked down and both schema fixtures must be
          # accessible to the API role after repeated setup.
          docker compose exec -T db psql -U postgres -d role_setup_ci -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            r record;
          BEGIN
            FOR r IN SELECT rolname, rolsuper, rolbypassrls FROM pg_roles
                      WHERE rolname IN ('app_user', 'rewards_worker_login', 'sms_learning_worker') LOOP
              IF r.rolsuper OR r.rolbypassrls THEN
                RAISE EXCEPTION 'role % must not be superuser or bypass rls', r.rolname;
              END IF;
            END LOOP;
            IF (SELECT count(*) FROM pg_roles
                 WHERE rolname IN ('app_user', 'rewards_worker_login', 'sms_learning_worker')) <> 3 THEN
              RAISE EXCEPTION 'the app roles must exist';
            END IF;
            IF NOT has_table_privilege('app_user', 'public.role_setup_fixture', 'SELECT')
               OR NOT has_schema_privilege('app_user', 'pandapay', 'USAGE') THEN
              RAISE EXCEPTION 'the app role must retain public table and pandapay schema grants';
            END IF;
          END $$;
          SQL
          docker compose exec -T db psql -U postgres -d pandapay -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE role_setup_ci'

      - name: Verify audited referral operator holds and status
        run: docker compose exec -T db psql -U postgres -d pandapay -v ON_ERROR_STOP=1 -f - < db/tests/20261021143000_referral_operator_controls_test.sql

      - name: Verify account data reset and permanent erasure
        run: docker compose exec -T db psql -U postgres -d pandapay -v ON_ERROR_STOP=1 -f - < db/tests/20261028150000_account_data_reset_test.sql

      - name: Smoke test
        run: python3 scripts/smoke_test.py

      # Logs only on failure — a green run does not need 500 lines of output,
      # and a red one is unreadable without them.
      - name: Service logs (on failure)
        if: failure()
        run: docker compose logs --tail 120

      - name: Tear down
        if: always()
        run: docker compose down -v

  anonymization-audit:
    name: Anonymization audit (deploy-blocking gate)
    uses: ./.github/workflows/anonymization-audit.yml
