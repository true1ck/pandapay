services:
  postgres:
    image: postgres:15
    container_name: pandapay-auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: pandapay_auth
    ports:
      - "5433:5432"
    volumes:
      - pandapay_auth_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pandapay_auth_data:
