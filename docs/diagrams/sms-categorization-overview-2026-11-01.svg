<text class="ov-title" x="45" y="272">A  Server transaction import</text>
<text class="ov-copy" x="45" y="302">parse + resolve category and card</text>
<text class="ov-copy" x="45" y="327">save or deduplicate server ledger</text>
</a>
<a href="../sms-categorization-pipeline-2026-11-01.html#section-8" aria-label="B  Structured financial facts: open its explanation"><rect class="ov-box" x="425" y="238" width="350" height="115" fill="#fff" rx="12"/>
<text class="ov-title" x="445" y="272">B  Structured financial facts</text>
