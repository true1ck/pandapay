<text class="ov-copy" x="445" y="327">validate facts; update projections</text>
</a>
<a href="../sms-categorization-pipeline-2026-11-01.html#section-9" aria-label="C  AI fallback: open its explanation"><rect class="ov-box" x="825" y="238" width="350" height="115" fill="#f1edfc" rx="12"/>
<text class="ov-title" x="845" y="272">C  AI fallback</text>
<text class="ov-copy" x="845" y="302">redacted text → checked proposal</text>
<text class="ov-copy" x="845" y="327">file locally, review or dismiss</text>
</a>
