<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img" aria-labelledby="overview-title overview-description"><title id="overview-title">SMS categorization at a glance</title><desc id="overview-description">Receive a message, filter and identify it, then parse on the phone. Use the applicable server transaction, structured facts or eligible unresolved AI path. File supported results, retain review or apply a supported dismissal. Personal corrections and evaluated shared learning improve future captures.</desc><defs><marker id="ov-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#657d83"/></marker></defs><style>.ov-title{font:700 22px Arial,sans-serif;fill:#193b43}.ov-copy{font:18px Arial,sans-serif;fill:#35565c}.ov-note{font:16px Arial,sans-serif;fill:#536e73}.ov-edge{fill:none;stroke:#657d83;stroke-width:2;marker-end:url(#ov-arrow)}.ov-box{stroke:#cadcda;stroke-width:1.2}a:hover .ov-box,a:focus .ov-box{stroke:#087568;stroke-width:2.5}</style><rect width="1200" height="665" fill="#f4f8f6" rx="14"/>
<a href="../sms-categorization-pipeline-2026-11-01.html#section-3" aria-label="1  Receive the SMS: open its explanation"><rect class="ov-box" x="25" y="30" width="350" height="103" fill="#edf4fc" rx="12"/>
<text class="ov-title" x="45" y="64">1  Receive the SMS</text>
<text class="ov-copy" x="45" y="94">sender + body + received time</text>
<text class="ov-copy" x="45" y="119">Android / iOS / backup</text>
</a>
<a href="../sms-categorization-pipeline-2026-11-01.html#section-4" aria-label="2  Check and identify: open its explanation"><rect class="ov-box" x="425" y="30" width="350" height="103" fill="#edf4fc" rx="12"/>
<text class="ov-title" x="445" y="64">2  Check and identify</text>
<text class="ov-copy" x="445" y="94">exclude secrets and clear noise</text>
<text class="ov-copy" x="445" y="119">reuse already-handled sources</text>
</a>
<a href="../sms-categorization-pipeline-2026-11-01.html#section-6" aria-label="3  Understand on the phone: open its explanation"><rect class="ov-box" x="825" y="30" width="350" height="103" fill="#edf4fc" rx="12"/>
<text class="ov-title" x="845" y="64">3  Understand on the phone</text>
<text class="ov-copy" x="845" y="94">rules + saved data + corrections</text>
<text class="ov-copy" x="845" y="119">save provisional evidence</text>
</a>
<path class="ov-edge" d="M375,82 H418"/>
<path class="ov-edge" d="M775,82 H818"/>
<text class="ov-note" x="25" y="158">Take the applicable path. AI is a fallback for eligible unresolved financial messages.</text>
