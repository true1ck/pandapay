# Plan Phase 0.5 — staging environment. Same shape as docker-compose.prod.yml
# (external Postgres, api/auth/backup services, secrets from an env file) so
# that verifying a change here is actually representative of prod, not a
# different topology that happens to also run the app. Meant to run on its
# own VM/Postgres, entirely separate from prod's.
#
# Migration sequencing: stop auth, API, rewards-worker and optional
# gemini-worker before the final paired backup and `db-migrate`. Keep them
# stopped until migrations finish, then start only the reviewed target images.
# The previous auth binary cannot enforce OTP purpose binding. See
# deploy/DEPLOY.md for the production sequence; staging must follow the same
# writer fence and forward-only failure behavior.
# Usage: follow the bounded writer-fence, paired-backup, migration, and
# reviewed-image startup sequence documented in deploy/DEPLOY.md.

name: pandapay-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db-migrate:
    build:
      context: .
      dockerfile: db/migrate/Dockerfile
      args:
        POSTGRES_CLIENT_MAJOR: "${POSTGRES_CLIENT_MAJOR:-17}"
    environment:
      NODE_ENV: staging
      ADMIN_DATABASE_URL: "${ADMIN_DATABASE_URL:?}"
      AUTH_MIGRATION_DATABASE_URL: "${AUTH_MIGRATION_DATABASE_URL:-${AUTH_DATABASE_URL:?}}"
      AUTH_RUNTIME_ROLE: "${AUTH_RUNTIME_ROLE:-}"
      APP_USER_PASSWORD: "${APP_USER_PASSWORD:?}"
      REWARD_WORKER_DB_PASSWORD: "${REWARD_WORKER_DB_PASSWORD:?}"
      # Opt-in blank (same policy as docker-compose.prod.yml).
      SMS_LEARNING_WORKER_DB_PASSWORD: "${SMS_LEARNING_WORKER_DB_PASSWORD:-}"
      # Unlike prod, staging genuinely benefits from the demo catalogue —
      # it's what QA/Phase 1+ verification actually exercises against.
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-true}"
      PHONE_LOOKUP_HMAC_KEY: "${PHONE_LOOKUP_HMAC_KEY:?}"
      ENCRYPTION_ENABLED: "${ENCRYPTION_ENABLED:-true}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?}"
      DB_SSL: "${DB_SSL:-true}"
      DB_SSL_CA: "${DB_SSL_CA:-}"
      MIGRATION_LEGACY_BASELINE_FILE: "${MIGRATION_LEGACY_BASELINE_FILE:-}"
      MIGRATION_ADOPT_LEGACY_CHECKSUMS: "${MIGRATION_ADOPT_LEGACY_CHECKSUMS:-false}"
    volumes:
      - ./db:/db:ro
      - type: bind
        source: "${MIGRATION_BASELINES_DIR:-./deploy/migration-baselines}"
        target: /run/migration-baselines
        read_only: true
        bind:
          create_host_path: false

  api:
    build:
      context: ./api
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: "${API_NODE_ENV:-staging}"
      TRUST_PROXY_HOPS: "1"
      DATABASE_URL: "${API_DATABASE_URL:?}"
      DB_SSL: "${DB_SSL:-true}"
      DB_SSL_CA: "${DB_SSL_CA:-}"
      DB_POOL_MAX: "${DB_POOL_MAX:-10}"
      DB_IDLE_TIMEOUT_MS: "${DB_IDLE_TIMEOUT_MS:-10000}"
      DB_CONNECTION_TIMEOUT_MS: "${DB_CONNECTION_TIMEOUT_MS:-5000}"
      DB_STATEMENT_TIMEOUT_MS: "${DB_STATEMENT_TIMEOUT_MS:-15000}"
      SMS_LEARNING_HMAC_KEY: "${SMS_LEARNING_HMAC_KEY:-}"
      PORT: "4000"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?}"
      JWT_KEYS_JSON: "${JWT_KEYS_JSON:-}"
      JWT_ACTIVE_KEY_ID: "${JWT_ACTIVE_KEY_ID:-1}"
      JWT_ISSUER: "${JWT_ISSUER:-pandapay-auth}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-mobile-app}"
      AUTH_INTERNAL_BASE_URL: http://auth:3210
      AUTH_INTERNAL_SERVICE_SECRET: "${AUTH_INTERNAL_SERVICE_SECRET:?}"
      REFERRAL_IDENTITY_HMAC_KEY: "${REFERRAL_IDENTITY_HMAC_KEY:?}"
      REFERRAL_IDENTITY_HMAC_KEY_VERSION: "${REFERRAL_IDENTITY_HMAC_KEY_VERSION:-v1}"
      REFERRAL_PREVIEW_SECRET: "${REFERRAL_PREVIEW_SECRET:?}"
      ENGAGEMENT_RECEIPT_SECRET: "${ENGAGEMENT_RECEIPT_SECRET:?}"
      REWARD_WORKER_INTERNAL_SECRET: "${REWARD_WORKER_INTERNAL_SECRET:?}"
      PRODUCT_TERMS_VERSION: "${PRODUCT_TERMS_VERSION:-2026-08-07}"
      INBOUND_EMAIL_WEBHOOK_SECRET: "${INBOUND_EMAIL_WEBHOOK_SECRET:?}"
      PARTNER_WEBHOOK_SECRET: "${PARTNER_WEBHOOK_SECRET:?}"
      IMAP_ENCRYPTION_KEY: "${IMAP_ENCRYPTION_KEY:?}"
      GOOGLE_PLACES_API_KEY: "${GOOGLE_PLACES_API_KEY:-}"
      NOTIFICATION_SERVICE_URL: "${NOTIFICATION_SERVICE_URL:?}"
      NOTIFICATION_SERVICE_API_KEY: "${NOTIFICATION_SERVICE_API_KEY:?}"
      NOTIFICATION_SERVICE_TIMEOUT_MS: "${NOTIFICATION_SERVICE_TIMEOUT_MS:-4000}"
    ports:
      - "127.0.0.1:4000:4000"

  rewards-worker:
    # SMS learning has its own worker and DB identity; see sms-learning-worker.
    build:
      context: ./api
    command: ["node", "src/rewards_worker.js"]
    # The shared API image probes /ready, but this worker has no HTTP server.
    # Check the actual PID 1 command instead; deeper liveness is monitored via
    # the worker heartbeat table.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          process.exit(require('fs').readFileSync('/proc/1/cmdline', 'utf8')
          .includes('src/rewards_worker.js') ? 0 : 1)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: "${REWARD_WORKER_DATABASE_URL:?}"
      DB_SSL: "${DB_SSL:-true}"
      DB_SSL_CA: "${DB_SSL_CA:-}"
      DB_POOL_MAX: "${DB_POOL_MAX:-10}"
      DB_IDLE_TIMEOUT_MS: "${DB_IDLE_TIMEOUT_MS:-10000}"
      DB_CONNECTION_TIMEOUT_MS: "${DB_CONNECTION_TIMEOUT_MS:-5000}"
      DB_STATEMENT_TIMEOUT_MS: "${DB_STATEMENT_TIMEOUT_MS:-15000}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?}"
      AUTH_INTERNAL_BASE_URL: http://auth:3210
      AUTH_INTERNAL_SERVICE_SECRET: "${AUTH_INTERNAL_SERVICE_SECRET:?}"
      REFERRAL_IDENTITY_HMAC_KEY: "${REFERRAL_IDENTITY_HMAC_KEY:?}"
      REFERRAL_IDENTITY_HMAC_KEY_VERSION: "${REFERRAL_IDENTITY_HMAC_KEY_VERSION:-v1}"
      REFERRAL_PREVIEW_SECRET: "${REFERRAL_PREVIEW_SECRET:?}"
      ENGAGEMENT_RECEIPT_SECRET: "${ENGAGEMENT_RECEIPT_SECRET:?}"
      REWARD_WORKER_INTERNAL_SECRET: "${REWARD_WORKER_INTERNAL_SECRET:?}"
      REWARD_WORKER_API_URL: http://api:4000
      REWARD_WORKER_ENABLED: "true"
      REWARD_WORKER_ID: "${REWARD_WORKER_ID:-rewards-worker-staging-1}"
      REWARD_WORKER_POLL_INTERVAL_MS: "${REWARD_WORKER_POLL_INTERVAL_MS:-5000}"
      REWARD_WORKER_BATCH_SIZE: "${REWARD_WORKER_BATCH_SIZE:-5}"
      REWARD_WORKER_LEASE_SECONDS: "${REWARD_WORKER_LEASE_SECONDS:-90}"
      INBOUND_EMAIL_WEBHOOK_SECRET: "${INBOUND_EMAIL_WEBHOOK_SECRET:?}"
      PARTNER_WEBHOOK_SECRET: "${PARTNER_WEBHOOK_SECRET:?}"
      IMAP_ENCRYPTION_KEY: "${IMAP_ENCRYPTION_KEY:?}"

  sms-learning-worker:
    profiles: ["sms-learning"]
    build:
      context: ./api
    command: ["node", "src/sms_learning_worker_runner.js"]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      SMS_LEARNING_DATABASE_URL: "${SMS_LEARNING_DATABASE_URL:-}"
      SMS_LEARNING_HMAC_KEY: "${SMS_LEARNING_HMAC_KEY:-}"
      SMS_LEARNING_WORKER_ROLE: "${SMS_LEARNING_WORKER_ROLE:-sms_learning_worker}"
      SMS_AUTONOMOUS_WORKER_INTERVAL_MS: "${SMS_AUTONOMOUS_WORKER_INTERVAL_MS:-300000}"
      DB_SSL: "${DB_SSL:-true}"
      DB_SSL_CA: "${DB_SSL_CA:-}"

  auth:
    build:
      context: ./auth
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      TRUST_PROXY_HOPS: "1"
      DATABASE_URL: "${AUTH_DATABASE_URL:?}"
      DB_SSL: "${DB_SSL:-true}"
      DB_SSL_CA: "${DB_SSL_CA:-}"
      DB_POOL_MAX: "${DB_POOL_MAX:-10}"
      DB_IDLE_TIMEOUT_MS: "${DB_IDLE_TIMEOUT_MS:-10000}"
      DB_CONNECTION_TIMEOUT_MS: "${DB_CONNECTION_TIMEOUT_MS:-5000}"
      PORT: "3210"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?}"
      JWT_KEYS_JSON: "${JWT_KEYS_JSON:-}"
      JWT_ACTIVE_KEY_ID: "${JWT_ACTIVE_KEY_ID:-1}"
      JWT_ISSUER: "${JWT_ISSUER:-pandapay-auth}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-mobile-app}"
      AUTH_INTERNAL_SERVICE_SECRET: "${AUTH_INTERNAL_SERVICE_SECRET:?}"
      PHONE_LOOKUP_HMAC_KEY: "${PHONE_LOOKUP_HMAC_KEY:?}"
      AUTH_ABUSE_BUCKET_CAPACITY: "${AUTH_ABUSE_BUCKET_CAPACITY:-100000}"
      JWT_ACCESS_TTL: "${JWT_ACCESS_TTL:-15m}"
      JWT_REFRESH_TTL: "${JWT_REFRESH_TTL:-180d}"
      REFRESH_MAX_IDLE_MINUTES: "${REFRESH_MAX_IDLE_MINUTES:-129600}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?}"
      # False, same as prod — staging exists to catch what a real OTP
      # provider does differently from the test path, not to skip it.
      ALLOW_TEST_OTP: "false"
      ENCRYPTION_ENABLED: "${ENCRYPTION_ENABLED:-true}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?}"
      EMAIL_HOST: "${EMAIL_HOST:?}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_USER: "${EMAIL_USER:?}"
      EMAIL_PASS: "${EMAIL_PASS:?}"
      EMAIL_FROM: "${EMAIL_FROM:?}"
      ENABLE_PHONE_OTP: "${ENABLE_PHONE_OTP:-false}"
      ENABLE_EMAIL_OTP: "${ENABLE_EMAIL_OTP:-true}"
    ports:
      - "127.0.0.1:3210:3210"

  backup:
    build:
      context: ./db
      dockerfile: backup/Dockerfile
      args:
        POSTGRES_CLIENT_MAJOR: "${POSTGRES_CLIENT_MAJOR:-17}"
    init: true
    tmpfs:
      - /tmp:mode=1777,size=32m
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: staging
      PRODUCT_DATABASE_URL: "${ADMIN_DATABASE_URL:?}"
      AUTH_DATABASE_URL: "${AUTH_MIGRATION_DATABASE_URL:-${AUTH_DATABASE_URL:?}}"
      DB_SSL: "${DB_SSL:-true}"
      DB_SSL_CA: "${DB_SSL_CA:-}"
      BACKUP_DIR: /var/backups/pandapay-staging
      BACKUP_AGE_RECIPIENTS_FILE: /run/secrets/backup-recipients.txt
      BACKUP_DESTINATION_A: /offhost/a
      BACKUP_DESTINATION_B: /offhost/b
      RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"
      BACKUP_MAX_SETS: "${BACKUP_MAX_SETS:-7}"
      BACKUP_MAX_BYTES: "${BACKUP_MAX_BYTES:-1073741824}"
      BACKUP_MIN_FREE_BYTES: "${BACKUP_MIN_FREE_BYTES:-536870912}"
      BACKUP_MAX_USAGE_PERCENT: "${BACKUP_MAX_USAGE_PERCENT:-85}"
    volumes:
      - staging_backups:/var/backups/pandapay-staging
      - type: bind
        source: "${BACKUP_AGE_RECIPIENTS_FILE:?}"
        target: /run/secrets/backup-recipients.txt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${BACKUP_DESTINATION_A:?}"
        target: /offhost/a
        bind:
          create_host_path: false
      - type: bind
        source: "${BACKUP_DESTINATION_B:?}"
        target: /offhost/b
        bind:
          create_host_path: false

volumes:
  staging_backups:
