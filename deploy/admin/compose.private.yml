# Opt-in private processes. Merge with production Compose only after acceptance.
# TLS to PostgreSQL must use the verified CA settings appropriate to the target.
services:
  admin-gateway:
    profiles: [admin]
    build:
      context: ./auth
    command: [node, src/admin/server.js]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    # 384m: a 14 MB card-catalogue reply peaks near 190 MB while the gateway reads and re-serialises it.
    mem_limit: 384m
    cpus: 0.5
    ports: ['127.0.0.1:4321:4321']
    networks: [admin_private]
    environment:
      NODE_ENV: production
      ADMIN_GATEWAY_ENABLED: 'true'
      ADMIN_APPROVED_BROWSER_ENROLLMENT: '${ADMIN_APPROVED_BROWSER_ENROLLMENT:-false}'
      ADMIN_ENVIRONMENT: '${ADMIN_ENVIRONMENT:?}'
      ADMIN_GATEWAY_HOST: '0.0.0.0'
      ADMIN_GATEWAY_PORT: '4321'
      ADMIN_CONTAINER_NETWORK: 'true'
      ADMIN_BROWSER_ORIGIN: 'https://localhost:8443'
      ADMIN_WEBAUTHN_RP_ID: localhost
      ADMIN_AUTH_DATABASE_URL: '${ADMIN_AUTH_DATABASE_URL:?}'
      ADMIN_API_BASE_URL: http://admin-api:4001
      ADMIN_TOKEN_LOOKUP_KEY: '${ADMIN_TOKEN_LOOKUP_KEY:?}'
      ADMIN_SESSION_EPOCH: '${ADMIN_SESSION_EPOCH:?}'
      ADMIN_INTROSPECTION_SERVICE_SECRET: '${ADMIN_INTROSPECTION_SERVICE_SECRET:?}'
      CONSOLE_SESSION_ENCRYPTION_KEY: '${CONSOLE_SESSION_ENCRYPTION_KEY:?}'
      DB_SSL: 'true'
      DB_SSL_CA: '${DB_SSL_CA:-}'
      ADMIN_SMTP_HOST: '${ADMIN_SMTP_HOST:?}'
      ADMIN_SMTP_PORT: '${ADMIN_SMTP_PORT:-587}'
      ADMIN_SMTP_USER: '${ADMIN_SMTP_USER:?}'
      ADMIN_SMTP_PASSWORD: '${ADMIN_SMTP_PASSWORD:?}'
      ADMIN_SMTP_FROM: '${ADMIN_SMTP_FROM:?}'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4321/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  admin-api:
    profiles: [admin]
    build:
      context: ./api
    command: [node, src/admin/server.js]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    # No published admin API port.
    networks: [admin_private]
    environment:
      NODE_ENV: production
      ADMIN_API_ENABLED: 'true'
      ADMIN_API_HOST: '0.0.0.0'
      ADMIN_API_PORT: '4001'
      ADMIN_CONTAINER_NETWORK: 'true'
      ADMIN_API_DATABASE_URL: '${ADMIN_API_DATABASE_URL:?}'
      ADMIN_INTROSPECTION_BASE_URL: http://admin-gateway:4321
      # System status page: deployed commit/branch/time (set by the operator's
      # deploy step) and the health endpoints to check. Not secrets.
      PANDAPAY_GIT_SHA: '${PANDAPAY_GIT_SHA:-}'
      PANDAPAY_GIT_REF: '${PANDAPAY_GIT_REF:-}'
      PANDAPAY_DEPLOYED_AT: '${PANDAPAY_DEPLOYED_AT:-}'
      ADMIN_HEALTH_PROBES: '${ADMIN_HEALTH_PROBES:-api=https://api.pandapath.site/ready,auth=https://auth.pandapath.site/ready}'
      ADMIN_INTROSPECTION_SERVICE_SECRET: '${ADMIN_INTROSPECTION_SERVICE_SECRET:?}'
      # Signs SMS rule sets on publish, pause and rollback. Never on the public API host.
      SMS_RULES_SIGNING_KEY: '${SMS_RULES_SIGNING_KEY:?}'
      SMS_RULES_KEY_ID: '${SMS_RULES_KEY_ID:?}'
      DB_SSL: 'true'
      DB_SSL_CA: '${DB_SSL_CA:-}'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  # Hourly SMS rule job: re-signs the rule sets phones download (they expire 7 days
  # after signing) and pauses rules with too many corrections. Runs at start-up,
  # then at minute 7 of every hour; a failed run is logged and retried next hour.
  sms-v2-rule-jobs:
    profiles: [admin]
    build:
      context: ./api
    command: [node, src/sms_v2/jobs/rule_jobs_main.js, --loop]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.25
    networks: [admin_private]
    # The image's HTTP health check is for the API server; this is not one.
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      ADMIN_API_DATABASE_URL: '${ADMIN_API_DATABASE_URL:?}'
      SMS_V2_JOB_ADMIN_ID: '${SMS_V2_JOB_ADMIN_ID:?}'
      SMS_RULES_SIGNING_KEY: '${SMS_RULES_SIGNING_KEY:?}'
      SMS_RULES_KEY_ID: '${SMS_RULES_KEY_ID:?}'
      SMS_V2_BUNDLE_REFRESH_BEFORE_HOURS: '${SMS_V2_BUNDLE_REFRESH_BEFORE_HOURS:-72}'
      DB_SSL: 'true'
      DB_SSL_CA: '${DB_SSL_CA:-}'
  # AI drafts: asks Gemini (paid key only) to draft a rule for each shared, redacted
  # message layout. Needs outbound HTTPS to generativelanguage.googleapis.com.
  sms-v2-template-worker:
    profiles: [admin]
    build:
      context: ./api
    command: [node, src/sms_v2/jobs/template_worker_main.js]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.25
    networks: [admin_private]
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      ADMIN_API_DATABASE_URL: '${ADMIN_API_DATABASE_URL:?}'
      SMS_V2_JOB_ADMIN_ID: '${SMS_V2_JOB_ADMIN_ID:?}'
      GEMINI_API_KEY: '${GEMINI_API_KEY:?}'
      SMS_V2_AI_MODEL: '${SMS_V2_AI_MODEL:?}'
      SMS_V2_AI_TPM: '${SMS_V2_AI_TPM:?}'
      SMS_V2_AI_RPM: '${SMS_V2_AI_RPM:-60}'
      SMS_V2_AI_MAX_OUTPUT_TOKENS: '${SMS_V2_AI_MAX_OUTPUT_TOKENS:-4096}'
      # Required so the console's AI cost figures are never blank.
      SMS_V2_AI_INPUT_USD_PER_MILLION: '${SMS_V2_AI_INPUT_USD_PER_MILLION:?}'
      SMS_V2_AI_OUTPUT_USD_PER_MILLION: '${SMS_V2_AI_OUTPUT_USD_PER_MILLION:?}'
      DB_SSL: 'true'
      DB_SSL_CA: '${DB_SSL_CA:-}'
networks:
  admin_private:
    driver: bridge
    # Egress needed for reviewed PostgreSQL and SMTP endpoints, and HTTPS to
    # generativelanguage.googleapis.com for sms-v2-template-worker only.
    # Restrict egress with the actual host firewall; no customer/worker joins.
