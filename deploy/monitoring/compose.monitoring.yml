# Monitoring VM: GlitchTip (errors), Prometheus + Alertmanager (metrics and
# alerts), Grafana (dashboards), Uptime Kuma (uptime checks).
#
# Runs on its own small VM so monitoring survives the app VM failing.
# Every UI binds to PRIVATE_BIND_IP (the VM's Tailscale address) only.
# The single public surface is Caddy forwarding error-report *ingestion*
# (POST /api/<project>/envelope|store/) to GlitchTip; its UI stays private.
# See README.md in this folder.

name: pandapay-monitoring

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      ERRORS_HOSTNAME: "${ERRORS_HOSTNAME:?Set ERRORS_HOSTNAME, e.g. errors.pandapath.live}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [glitchtip]

  glitchtip-postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    # GlitchTip partitions event tables; its install guide raises this limit.
    command: [postgres, -c, max_locks_per_transaction=512]
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_DB: glitchtip
      POSTGRES_PASSWORD: "${GLITCHTIP_DB_PASSWORD:?Set GLITCHTIP_DB_PASSWORD}"
    volumes: [glitchtip-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U glitchtip -d glitchtip]
      interval: 10s
      retries: 10

  glitchtip-valkey:
    image: valkey/valkey:8.1.11-alpine
    restart: unless-stopped

  glitchtip:
    image: glitchtip/glitchtip:6.2.6
    restart: unless-stopped
    # Web + embedded worker; runs database migrations on start.
    command: ./bin/run-all-in-one.sh
    depends_on:
      glitchtip-postgres: {condition: service_healthy}
      glitchtip-valkey: {condition: service_started}
    environment:
      DATABASE_URL: "postgres://glitchtip:${GLITCHTIP_DB_PASSWORD}@glitchtip-postgres:5432/glitchtip"
      VALKEY_URL: "redis://glitchtip-valkey:6379/0"
      SECRET_KEY: "${GLITCHTIP_SECRET_KEY:?Set GLITCHTIP_SECRET_KEY}"
      # DSNs handed to the apps use this public ingestion address.
      GLITCHTIP_DOMAIN: "https://${ERRORS_HOSTNAME}"
      CSRF_TRUSTED_ORIGINS: "http://${PRIVATE_BIND_IP}:8000"
      DEFAULT_FROM_EMAIL: "${GLITCHTIP_FROM_EMAIL:-glitchtip@localhost}"
      EMAIL_URL: "${GLITCHTIP_EMAIL_URL:-consolemail://}"
      # Nobody can sign themselves up; accounts are created with createsuperuser.
      ENABLE_USER_REGISTRATION: "false"
      ENABLE_ORGANIZATION_CREATION: "false"
      # Keep error data no longer than needed.
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: "30"
    ports: ["${PRIVATE_BIND_IP:?Set PRIVATE_BIND_IP to this VM's Tailscale IP}:8000:8000"]

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      # The app VM's agent pushes metrics here over Tailscale.
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports: ["${PRIVATE_BIND_IP:?Set PRIVATE_BIND_IP}:9090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager

  grafana:
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}"
      GF_SERVER_ROOT_URL: "http://${PRIVATE_BIND_IP}:3000"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["${PRIVATE_BIND_IP:?Set PRIVATE_BIND_IP}:3000:3000"]

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.6
    restart: unless-stopped
    volumes: [uptime-kuma-data:/app/data]
    ports: ["${PRIVATE_BIND_IP:?Set PRIVATE_BIND_IP}:3001:3001"]

volumes:
  caddy-data:
  caddy-config:
  glitchtip-db:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  uptime-kuma-data:
