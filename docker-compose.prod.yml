# Plan Phase 0.2 — production-shaped compose file, host-agnostic (any
# Docker-capable Linux VM; Oracle Cloud is the intended eventual target but
# nothing here is Oracle-specific).
#
# Deliberately NOT an override merged on top of docker-compose.yml: that file
# runs Postgres as a local container with a bind-mounted volume, which its own
# header already calls out as "NOT a production topology" — production wants
# a managed instance or at minimum a Postgres run and backed up independently
# of the app containers' lifecycle. This file assumes that Postgres already
# exists somewhere reachable by URL and only runs api/, auth/, and the backup
# scheduler.
#
# Migration sequencing: never run `db-migrate` while an old API/auth process or
# writer worker is serving. Build the target images first, stop auth, API,
# rewards-worker, take and verify the final paired
# backup, then migrate and start only those target images. `deploy/deploy.sh`
# enforces this order; see deploy/DEPLOY.md for the bounded manual sequence.
# Usage: see deploy/DEPLOY.md for the full bounded backup/fence/migrate/start
# sequence. Do not run db-migrate directly against a live stack.
#
# api/ and auth/ publish only to 127.0.0.1 — nginx (deploy/nginx/*) is the
# only thing meant to reach them from outside the host, terminating TLS and
# proxying in. Binding to all interfaces here would put an unencrypted,
# un-proxied JWT-bearing API directly on the internet.

name: pandapay-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # One-shot migration job. Run only through the fenced backup/migration
  # sequence in deploy/DEPLOY.md; do not invoke it directly against live
  # writers. The deploy script uses the prebuilt image after its paired backup.
  db-migrate:
    build:
      context: .
      dockerfile: db/migrate/Dockerfile
      args:
        POSTGRES_CLIENT_MAJOR: "${POSTGRES_CLIENT_MAJOR:-17}"
    environment:
      NODE_ENV: production
      ADMIN_DATABASE_URL: "${ADMIN_DATABASE_URL:?}"
      AUTH_MIGRATION_DATABASE_URL: "${AUTH_MIGRATION_DATABASE_URL:-${AUTH_DATABASE_URL:?}}"
      AUTH_RUNTIME_ROLE: "${AUTH_RUNTIME_ROLE:-}"
      ENABLE_ADMIN_DASHBOARD: "${ENABLE_ADMIN_DASHBOARD:-false}"
      PARTNER_WEBHOOK_DB_PASSWORD: "${PARTNER_WEBHOOK_DB_PASSWORD:-}"
      IMAP_WORKER_DB_PASSWORD: "${IMAP_WORKER_DB_PASSWORD:-}"
      BACKUP_STATUS_WRITER_DB_PASSWORD: "${BACKUP_STATUS_WRITER_DB_PASSWORD:-}"
      CONSOLE_SESSION_DB_PASSWORD: "${CONSOLE_SESSION_DB_PASSWORD:-}"
      ADMIN_GATEWAY_DB_PASSWORD: "${ADMIN_GATEWAY_DB_PASSWORD:-}"
      ADMIN_API_DB_PASSWORD: "${ADMIN_API_DB_PASSWORD:-}"
      AUTH_LIFECYCLE_DB_PASSWORD: "${AUTH_LIFECYCLE_DB_PASSWORD:-}"
      ACCOUNT_LIFECYCLE_DB_PASSWORD: "${ACCOUNT_LIFECYCLE_DB_PASSWORD:-}"
      MAINTENANCE_DB_PASSWORD: "${MAINTENANCE_DB_PASSWORD:-}"
      AUTH_MAINTENANCE_DB_PASSWORD: "${AUTH_MAINTENANCE_DB_PASSWORD:-}"
      MAINTENANCE_READER_DB_PASSWORD: "${MAINTENANCE_READER_DB_PASSWORD:-}"
      DB_ACCESS_LOGGING_ENABLED: "${DB_ACCESS_LOGGING_ENABLED:-false}"
      APP_USER_PASSWORD: "${APP_USER_PASSWORD:?}"
      REWARD_WORKER_DB_PASSWORD: "${REWARD_WORKER_DB_PASSWORD:?}"
      # Opt-in: blank keeps the autonomous SMS learner disabled (no dedicated
      # login is bootstrapped — see db/setup_app_role.sql).
      SMS_LEARNING_WORKER_DB_PASSWORD: "${SMS_LEARNING_WORKER_DB_PASSWORD:-}"
      # Opt-in: blank leaves the SMS AI drafts worker's login (sms_ai_worker) uncreated.
      SMS_AI_WORKER_DB_PASSWORD: "${SMS_AI_WORKER_DB_PASSWORD:-}"
      # Only the split directory backfill (auth/scripts/backfillSplitDirectory.js) reads this.
      SHARED_EXPENSE_INVITE_SECRET: "${SHARED_EXPENSE_INVITE_SECRET:-}"
      PHONE_LOOKUP_HMAC_KEY: "${PHONE_LOOKUP_HMAC_KEY:?}"
      ENCRYPTION_ENABLED: "${ENCRYPTION_ENABLED:-true}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?}"
      ENCRYPTION_V2_WRITES_ENABLED: "${ENCRYPTION_V2_WRITES_ENABLED:-false}"
      ENCRYPTION_WRITE_KEY_ID: "${ENCRYPTION_WRITE_KEY_ID:-}"
      ENCRYPTION_READ_KEYS_JSON: "${ENCRYPTION_READ_KEYS_JSON:-}"
      DB_SSL: "${DB_SSL:-true}"
      DB_SSL_CA: "${DB_SSL_CA:-}"
      MIGRATION_LEGACY_BASELINE_FILE: "${MIGRATION_LEGACY_BASELINE_FILE:-}"
      MIGRATION_ADOPT_LEGACY_CHECKSUMS: "${MIGRATION_ADOPT_LEGACY_CHECKSUMS:-false}"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-false}"
    volumes:
      - ./db:/db:ro
      - type: bind
        source: "${MIGRATION_BASELINES_DIR:-./deploy/migration-baselines}"
        target: /run/migration-baselines
        read_only: true
        bind:
          create_host_path: false

  api:
    build:
      context: ./api
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      # Monitoring (deploy/monitoring/README.md). Off until set in .env:
      # metrics listen only inside the Docker network (port never published),
      # and error reports carry no message text or user data.
      METRICS_PORT: "${API_METRICS_PORT:-}"
      METRICS_HOST: "0.0.0.0"
      ERROR_REPORTING_DSN: "${API_ERROR_REPORTING_DSN:-}"
      PANDAPAY_GIT_SHA: "${PANDAPAY_GIT_SHA:-}"
      PANDAPAY_ENVIRONMENT: "${PANDAPAY_ENVIRONMENT:-production}"
      TRUST_PROXY_HOPS: "1"
      DATABASE_URL: "${API_DATABASE_URL:?}"
      DB_SSL: "${DB_SSL:-true}"
      DB_SSL_CA: "${DB_SSL_CA:-}"
      DB_POOL_MAX: "${DB_POOL_MAX:-10}"
      DB_IDLE_TIMEOUT_MS: "${DB_IDLE_TIMEOUT_MS:-10000}"
      DB_CONNECTION_TIMEOUT_MS: "${DB_CONNECTION_TIMEOUT_MS:-5000}"
      DB_STATEMENT_TIMEOUT_MS: "${DB_STATEMENT_TIMEOUT_MS:-15000}"
      PORT: "4000"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?}"
      JWT_KEYS_JSON: "${JWT_KEYS_JSON:-}"
      JWT_ACTIVE_KEY_ID: "${JWT_ACTIVE_KEY_ID:-1}"
      JWT_ISSUER: "${JWT_ISSUER:-pandapay-auth}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-mobile-app}"
      AUTH_INTERNAL_BASE_URL: http://auth:3210
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?}"
      AUTH_INTERNAL_SERVICE_SECRET: "${AUTH_INTERNAL_SERVICE_SECRET:?}"
      REFERRAL_IDENTITY_HMAC_KEY: "${REFERRAL_IDENTITY_HMAC_KEY:?}"
      REFERRAL_IDENTITY_HMAC_KEY_VERSION: "${REFERRAL_IDENTITY_HMAC_KEY_VERSION:-v1}"
      REFERRAL_PREVIEW_SECRET: "${REFERRAL_PREVIEW_SECRET:?}"
      ENGAGEMENT_RECEIPT_SECRET: "${ENGAGEMENT_RECEIPT_SECRET:?}"
      REWARD_WORKER_INTERNAL_SECRET: "${REWARD_WORKER_INTERNAL_SECRET:?}"
      PRODUCT_TERMS_VERSION: "${PRODUCT_TERMS_VERSION:-2026-11-15}"
      SMS_LEARNING_HMAC_KEY: "${SMS_LEARNING_HMAC_KEY:-}"
      INBOUND_EMAIL_WEBHOOK_SECRET: "${INBOUND_EMAIL_WEBHOOK_SECRET:?}"
      PARTNER_WEBHOOK_SECRET: "${PARTNER_WEBHOOK_SECRET:?}"
      PARTNER_WEBHOOK_DATABASE_URL: "${PARTNER_WEBHOOK_DATABASE_URL:-}"
      STATEMENT_IMPORT_RECEIPTS_ENABLED: "${STATEMENT_IMPORT_RECEIPTS_ENABLED:-false}"
      SHARED_FEEDBACK_ADMISSION_ENABLED: "${SHARED_FEEDBACK_ADMISSION_ENABLED:-false}"
      SHARED_FEEDBACK_DATABASE_URL: "${SHARED_FEEDBACK_DATABASE_URL:-}"
      SHARED_FEEDBACK_HMAC_KEY: "${SHARED_FEEDBACK_HMAC_KEY:-}"
      NOTIFICATION_OUTBOX_ENABLED: "${NOTIFICATION_OUTBOX_ENABLED:-false}"
      NOTIFICATION_OUTBOX_DATABASE_URL: "${NOTIFICATION_OUTBOX_DATABASE_URL:-}"
      IMAP_POLL_DATABASE_URL: "${IMAP_POLL_DATABASE_URL:-}"
      IMAP_POLL_INTERVAL_MINUTES: "${IMAP_POLL_INTERVAL_MINUTES:-0}"
      ACCOUNT_LIFECYCLE_ENABLED: "${ACCOUNT_LIFECYCLE_ENABLED:-false}"
      ACCOUNT_LIFECYCLE_DATABASE_URL: "${ACCOUNT_LIFECYCLE_DATABASE_URL:-}"
      ACCOUNT_LIFECYCLE_POLL_INTERVAL_MS: "${ACCOUNT_LIFECYCLE_POLL_INTERVAL_MS:-0}"
      # Add the reviewed private journal mounts in a release-specific override.
      ACCOUNT_LIFECYCLE_JOURNAL_A: "${ACCOUNT_LIFECYCLE_JOURNAL_A:-}"
      ACCOUNT_LIFECYCLE_CHECKPOINT_ROOT: "${ACCOUNT_LIFECYCLE_CHECKPOINT_ROOT:-}"
      ACCOUNT_LIFECYCLE_JOURNAL_B: "${ACCOUNT_LIFECYCLE_JOURNAL_B:-}"
      ACCOUNT_LIFECYCLE_JOURNAL_ID: "${ACCOUNT_LIFECYCLE_JOURNAL_ID:-}"
      ACCOUNT_LIFECYCLE_JOURNAL_AUTH_KEY: "${ACCOUNT_LIFECYCLE_JOURNAL_AUTH_KEY:-}"
      ACCOUNT_LIFECYCLE_JOURNAL_RECIPIENTS_FILE: "${ACCOUNT_LIFECYCLE_JOURNAL_RECIPIENTS_FILE:-}"
      ACCOUNT_LIFECYCLE_JOURNAL_AGE_BINARY: "${ACCOUNT_LIFECYCLE_JOURNAL_AGE_BINARY:-age}"
      SYNC_TYPED_WRITES_ENABLED: "${SYNC_TYPED_WRITES_ENABLED:-false}"
      IMAP_ENCRYPTION_KEY: "${IMAP_ENCRYPTION_KEY:?}"
      IMAP_ENCRYPTION_KEY_ID: "${IMAP_ENCRYPTION_KEY_ID:-k1}"
      IMAP_ENCRYPTION_PREVIOUS_KEYS: "${IMAP_ENCRYPTION_PREVIOUS_KEYS:-}"
      GOOGLE_PLACES_API_KEY: "${GOOGLE_PLACES_API_KEY:-}"
      # Remote push delivery is optional at the API layer. Keep these empty
      # until the private notification provider is configured; the API then
      # exposes the notification routes and reports a truthful 503 instead of
      # preventing the entire production API from starting.
      NOTIFICATION_SERVICE_URL: "${NOTIFICATION_SERVICE_URL:-}"
      NOTIFICATION_SERVICE_API_KEY: "${NOTIFICATION_SERVICE_API_KEY:-}"
      NOTIFICATION_SERVICE_TIMEOUT_MS: "${NOTIFICATION_SERVICE_TIMEOUT_MS:-4000}"
      # Split invitations sign invite links and hash invited phone numbers with
      # this host-only key (at least 32 characters). Blank keeps the invitation
      # routes answering a truthful 503 instead of stopping the API.
      SHARED_EXPENSE_INVITE_SECRET: "${SHARED_EXPENSE_INVITE_SECRET:-}"
      # Join requests may carry the claimant's phone number for the group owner, only
      # when the claimant chose to share it. Off unless explicitly enabled. The key
      # ring is a host-only secret (JSON, see .env.prod.example); without a usable
      # ring nothing is ever stored and the API logs a warning at startup.
      SHARED_EXPENSE_PHONE_SHARING_ENABLED: "${SHARED_EXPENSE_PHONE_SHARING_ENABLED:-false}"
      SHARED_EXPENSE_PHONE_ENC_KEYS: "${SHARED_EXPENSE_PHONE_ENC_KEYS:-}"
    ports:
      - "127.0.0.1:4000:4000"

  rewards-worker:
    build:
      context: ./api
    command: ["node", "src/rewards_worker.js"]
    # The shared API image probes /ready, but this worker has no HTTP server.
    # Check the actual PID 1 command instead; deeper liveness is monitored via
    # the worker heartbeat table.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          process.exit(require('fs').readFileSync('/proc/1/cmdline', 'utf8')
          .includes('src/rewards_worker.js') ? 0 : 1)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: "${REWARD_WORKER_DATABASE_URL:?}"
      DB_SSL: "${DB_SSL:-true}"
      DB_SSL_CA: "${DB_SSL_CA:-}"
      DB_POOL_MAX: "${DB_POOL_MAX:-10}"
      DB_IDLE_TIMEOUT_MS: "${DB_IDLE_TIMEOUT_MS:-10000}"
      DB_CONNECTION_TIMEOUT_MS: "${DB_CONNECTION_TIMEOUT_MS:-5000}"
      DB_STATEMENT_TIMEOUT_MS: "${DB_STATEMENT_TIMEOUT_MS:-15000}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?}"
      AUTH_INTERNAL_BASE_URL: http://auth:3210
      AUTH_INTERNAL_SERVICE_SECRET: "${AUTH_INTERNAL_SERVICE_SECRET:?}"
      REFERRAL_IDENTITY_HMAC_KEY: "${REFERRAL_IDENTITY_HMAC_KEY:?}"
      REFERRAL_IDENTITY_HMAC_KEY_VERSION: "${REFERRAL_IDENTITY_HMAC_KEY_VERSION:-v1}"
      REFERRAL_PREVIEW_SECRET: "${REFERRAL_PREVIEW_SECRET:?}"
      ENGAGEMENT_RECEIPT_SECRET: "${ENGAGEMENT_RECEIPT_SECRET:?}"
      REWARD_WORKER_INTERNAL_SECRET: "${REWARD_WORKER_INTERNAL_SECRET:?}"
      REWARD_WORKER_API_URL: http://api:4000
      REWARD_WORKER_ENABLED: "true"
      REWARD_WORKER_ID: "${REWARD_WORKER_ID:-rewards-prod-1}"
      REWARD_WORKER_POLL_INTERVAL_MS: "${REWARD_WORKER_POLL_INTERVAL_MS:-5000}"
      REWARD_WORKER_BATCH_SIZE: "${REWARD_WORKER_BATCH_SIZE:-5}"
      REWARD_WORKER_LEASE_SECONDS: "${REWARD_WORKER_LEASE_SECONDS:-90}"
      INBOUND_EMAIL_WEBHOOK_SECRET: "${INBOUND_EMAIL_WEBHOOK_SECRET:?}"
      PARTNER_WEBHOOK_SECRET: "${PARTNER_WEBHOOK_SECRET:?}"
      IMAP_ENCRYPTION_KEY: "${IMAP_ENCRYPTION_KEY:?}"
      IMAP_ENCRYPTION_KEY_ID: "${IMAP_ENCRYPTION_KEY_ID:-k1}"
      IMAP_ENCRYPTION_PREVIOUS_KEYS: "${IMAP_ENCRYPTION_PREVIOUS_KEYS:-}"

  # SMS AI drafts: asks Gemini to draft a rule for each shared, REDACTED message
  # layout (never message text). OPT-IN: deploy/deploy.sh and restart-services.sh
  # only build and start this when every setting below is present in the host's
  # .env; with none of them set the production deploy is exactly as before.
  # Nothing here is `:?`-required, so a missing setting can never stop Compose
  # from parsing the file for the other services. Only this service is given the
  # Gemini key and the least-privilege `sms_ai_worker` database login (created by
  # db-migrate from SMS_AI_WORKER_DB_PASSWORD); api/auth/rewards-worker get neither.
  sms-v2-template-worker:
    profiles: [sms-ai]
    build:
      context: ./api
    command: ["node", "src/sms_v2/jobs/template_worker_main.js"]
    # No HTTP server; check the actual PID 1 command, as rewards-worker does.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          process.exit(require('fs').readFileSync('/proc/1/cmdline', 'utf8')
          .includes('template_worker_main.js') ? 0 : 1)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    # The production host is small (see deploy/restart-services.sh).
    mem_limit: 192m
    cpus: 0.25
    environment:
      NODE_ENV: production
      SMS_AI_WORKER_DATABASE_URL: "${SMS_AI_WORKER_DATABASE_URL:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      SMS_V2_AI_MODEL: "${SMS_V2_AI_MODEL:-}"
      SMS_V2_AI_TPM: "${SMS_V2_AI_TPM:-}"
      SMS_V2_AI_RPM: "${SMS_V2_AI_RPM:-60}"
      SMS_V2_AI_MAX_OUTPUT_TOKENS: "${SMS_V2_AI_MAX_OUTPUT_TOKENS:-4096}"
      SMS_V2_AI_INPUT_USD_PER_MILLION: "${SMS_V2_AI_INPUT_USD_PER_MILLION:-}"
      SMS_V2_AI_OUTPUT_USD_PER_MILLION: "${SMS_V2_AI_OUTPUT_USD_PER_MILLION:-}"
      DB_SSL: "${DB_SSL:-true}"
      DB_SSL_CA: "${DB_SSL_CA:-}"

  auth:
    build:
      context: ./auth
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      # Monitoring (deploy/monitoring/README.md). Off until set in .env:
      # metrics listen only inside the Docker network (port never published),
      # and error reports carry no message text or user data.
      METRICS_PORT: "${AUTH_METRICS_PORT:-}"
      METRICS_HOST: "0.0.0.0"
      ERROR_REPORTING_DSN: "${AUTH_ERROR_REPORTING_DSN:-}"
      PANDAPAY_GIT_SHA: "${PANDAPAY_GIT_SHA:-}"
      PANDAPAY_ENVIRONMENT: "${PANDAPAY_ENVIRONMENT:-production}"
      TRUST_PROXY_HOPS: "1"
      ENABLE_ADMIN_DASHBOARD: "${ENABLE_ADMIN_DASHBOARD:-false}"
      DB_ACCESS_LOGGING_ENABLED: "${DB_ACCESS_LOGGING_ENABLED:-false}"
      NEW_ACCOUNT_REGISTRATIONS_PAUSED: "${NEW_ACCOUNT_REGISTRATIONS_PAUSED:-false}"
      CONSOLE_BROWSER_ENABLED: "${CONSOLE_BROWSER_ENABLED:-false}"
      CONSOLE_BROWSER_ORIGIN: "${CONSOLE_BROWSER_ORIGIN:-}"
      CONSOLE_SESSION_DATABASE_URL: "${CONSOLE_SESSION_DATABASE_URL:-}"
      CONSOLE_SESSION_ENCRYPTION_KEY: "${CONSOLE_SESSION_ENCRYPTION_KEY:-}"
      CONSOLE_AUTH_UPSTREAM: http://127.0.0.1:3210
      CONSOLE_API_UPSTREAM: http://api:4000
      ACCOUNT_LIFECYCLE_ENABLED: "${ACCOUNT_LIFECYCLE_ENABLED:-false}"
      AUTH_LIFECYCLE_DATABASE_URL: "${AUTH_LIFECYCLE_DATABASE_URL:-}"
      DATABASE_URL: "${AUTH_DATABASE_URL:?}"
      DB_SSL: "${DB_SSL:-true}"
      DB_SSL_CA: "${DB_SSL_CA:-}"
      DB_POOL_MAX: "${DB_POOL_MAX:-10}"
      OTP_WORK_MAX_CONCURRENT: "${OTP_WORK_MAX_CONCURRENT:-2}"
      OTP_EMAIL_MAX_CONCURRENT: "${OTP_EMAIL_MAX_CONCURRENT:-2}"
      OTP_SMS_MAX_CONCURRENT: "${OTP_SMS_MAX_CONCURRENT:-2}"
      DB_IDLE_TIMEOUT_MS: "${DB_IDLE_TIMEOUT_MS:-10000}"
      DB_CONNECTION_TIMEOUT_MS: "${DB_CONNECTION_TIMEOUT_MS:-5000}"
      PORT: "3210"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?}"
      JWT_KEYS_JSON: "${JWT_KEYS_JSON:-}"
      JWT_ACTIVE_KEY_ID: "${JWT_ACTIVE_KEY_ID:-1}"
      JWT_ISSUER: "${JWT_ISSUER:-pandapay-auth}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-mobile-app}"
      AUTH_INTERNAL_SERVICE_SECRET: "${AUTH_INTERNAL_SERVICE_SECRET:?}"
      PHONE_LOOKUP_HMAC_KEY: "${PHONE_LOOKUP_HMAC_KEY:?}"
      AUTH_ABUSE_BUCKET_CAPACITY: "${AUTH_ABUSE_BUCKET_CAPACITY:-100000}"
      JWT_ACCESS_TTL: "${JWT_ACCESS_TTL:-15m}"
      JWT_REFRESH_TTL: "${JWT_REFRESH_TTL:-90d}"
      REFRESH_MAX_IDLE_MINUTES: "${REFRESH_MAX_IDLE_MINUTES:-129600}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?}"
      # Must be absent/false everywhere reachable from the internet — it lets
      # OTP verification succeed without sending a real code.
      ALLOW_TEST_OTP: "false"
      ENCRYPTION_ENABLED: "${ENCRYPTION_ENABLED:-true}"
      # Preserve the original legacy AES key. Hosted auth refuses startup
      # if it is missing/invalid; optional read keys never replace it.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?}"
      ENCRYPTION_V2_WRITES_ENABLED: "${ENCRYPTION_V2_WRITES_ENABLED:-false}"
      ENCRYPTION_WRITE_KEY_ID: "${ENCRYPTION_WRITE_KEY_ID:-}"
      ENCRYPTION_READ_KEYS_JSON: "${ENCRYPTION_READ_KEYS_JSON:-}"
      # Generic SMTP — auth/src/services/emailService.js uses nodemailer
      # against any host, Gmail included. Without these, emailService.js
      # falls back to logging the OTP to the container's own stdout instead
      # of sending it, which works for local dev and is silently useless in
      # production (no user will ever see that log).
      EMAIL_HOST: "${EMAIL_HOST:?}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_USER: "${EMAIL_USER:?}"
      EMAIL_PASS: "${EMAIL_PASS:?}"
      EMAIL_FROM: "${EMAIL_FROM:?}"
      # No SMS provider (Twilio) configured — see .env.prod.example's note.
      # Phone OTP would otherwise accept a signup it can never actually
      # deliver a code for; email-only is the honest default until/unless an
      # SMS provider is added.
      ENABLE_PHONE_OTP: "${ENABLE_PHONE_OTP:-false}"
      ENABLE_EMAIL_OTP: "${ENABLE_EMAIL_OTP:-true}"
      AUTH_RETIRE_LEGACY_OTP: "${AUTH_RETIRE_LEGACY_OTP:-false}"
      AUTH_RETIRE_PUBLIC_LOOKUP: "${AUTH_RETIRE_PUBLIC_LOOKUP:-false}"
      # The phone lock (docs/EMAIL_PHONE_LOCK_PLAN_2026-11-09.md). Off until the
      # app has the phone step; see .env.prod.example before switching it on.
      REQUIRE_PHONE_AT_SIGNUP: "${REQUIRE_PHONE_AT_SIGNUP:-false}"
      PHONE_ALLOWED_COUNTRIES: "${PHONE_ALLOWED_COUNTRIES:-IN}"
      # One reminder email, 7 days after sign-up, to accounts with no recovery email.
      RECOVERY_REMINDER_EMAILS_ENABLED: "${RECOVERY_REMINDER_EMAILS_ENABLED:-false}"
      # Account recovery (docs/RECOVERY_FLOW_DESIGN_2026-11-09.md). The card question
      # goes to api/ on the private network; the stop links in recovery emails need
      # the address people can reach auth/ at from outside.
      PRODUCT_API_INTERNAL_URL: http://api:4000
      AUTH_PUBLIC_BASE_URL: "${AUTH_PUBLIC_BASE_URL:-}"
      # Accounts one phone may hold; past it a sign-up is only logged until enforcement
      # is switched on. 0 turns the check off. See .env.prod.example.
      DEVICE_ACCOUNT_LIMIT: "${DEVICE_ACCOUNT_LIMIT:-3}"
      DEVICE_ACCOUNT_LIMIT_ENFORCE: "${DEVICE_ACCOUNT_LIMIT_ENFORCE:-false}"
    ports:
      - "127.0.0.1:3210:3210"

  backup:
    build:
      context: ./db
      dockerfile: backup/Dockerfile
      args:
        POSTGRES_CLIENT_MAJOR: "${POSTGRES_CLIENT_MAJOR:-17}"
    init: true
    tmpfs:
      - /tmp:mode=1777,size=32m
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PRODUCT_DATABASE_URL: "${ADMIN_DATABASE_URL:?}"
      AUTH_DATABASE_URL: "${AUTH_MIGRATION_DATABASE_URL:-${AUTH_DATABASE_URL:?}}"
      DB_SSL: "${DB_SSL:-true}"
      DB_SSL_CA: "${DB_SSL_CA:-}"
      BACKUP_DIR: /var/backups/pandapay
      BACKUP_MODE: "${BACKUP_MODE:-offhost}"
      BACKUP_AGE_RECIPIENTS_FILE: /run/secrets/backup-recipients.txt
      BACKUP_DESTINATION_A: /offhost/a
      BACKUP_DESTINATION_B: /offhost/b
      RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"
      BACKUP_MAX_SETS: "${BACKUP_MAX_SETS:-7}"
      BACKUP_MAX_BYTES: "${BACKUP_MAX_BYTES:-1073741824}"
      BACKUP_MIN_FREE_BYTES: "${BACKUP_MIN_FREE_BYTES:-536870912}"
      BACKUP_MAX_USAGE_PERCENT: "${BACKUP_MAX_USAGE_PERCENT:-85}"
    volumes:
      - backups:/var/backups/pandapay
      - type: bind
        source: "${BACKUP_AGE_RECIPIENTS_FILE:?}"
        target: /run/secrets/backup-recipients.txt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        # A path beneath /dev/null cannot be mounted; fail closed when absent.
        # Interpolation must allow local mode to replace this mount entirely.
        source: "${BACKUP_DESTINATION_A:-/dev/null/backup-destination-a-required}"
        target: /offhost/a
        bind:
          create_host_path: false
      - type: bind
        source: "${BACKUP_DESTINATION_B:-/dev/null/backup-destination-b-required}"
        target: /offhost/b
        bind:
          create_host_path: false

  # Explicit one-shot commands; profile does not install a host scheduler.
  operational-maintenance:
    profiles: [maintenance]
    build:
      context: ./api
    command: [node, src/maintenance/cli.js, --run]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    logging: *default-logging
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      MAINTENANCE_ENABLED: "${MAINTENANCE_ENABLED:-false}"
      MAINTENANCE_DATABASE_URL: "${MAINTENANCE_DATABASE_URL:-}"
      DB_SSL: "${DB_SSL:-true}"
      DB_SSL_CA: "${DB_SSL_CA:-}"

  auth-retention-maintenance:
    profiles: [maintenance]
    build:
      context: ./auth
    command: [node, src/services/maintenanceCli.js, --run, --apply]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    logging: *default-logging
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      AUTH_RETENTION_MAINTENANCE_ENABLED: "${AUTH_RETENTION_MAINTENANCE_ENABLED:-false}"
      AUTH_MAINTENANCE_DATABASE_URL: "${AUTH_MAINTENANCE_DATABASE_URL:-}"
      AUTH_RETENTION_DATABASE_URL: "${AUTH_RETENTION_DATABASE_URL:-}"
      AUTH_DB_ACCESS_LOG_RETENTION_DAYS: "${AUTH_DB_ACCESS_LOG_RETENTION_DAYS:-}"
      AUTH_ABUSE_STATE_RETENTION_DAYS: "${AUTH_ABUSE_STATE_RETENTION_DAYS:-}"
      AUTH_RETENTION_BATCH_SIZE: "${AUTH_RETENTION_BATCH_SIZE:-100}"
      AUTH_RETENTION_MAX_BATCHES: "${AUTH_RETENTION_MAX_BATCHES:-10}"
      AUTH_RETENTION_MAX_DURATION_MS: "${AUTH_RETENTION_MAX_DURATION_MS:-5000}"
      DB_SSL: "${DB_SSL:-true}"
      DB_SSL_CA: "${DB_SSL_CA:-}"

volumes:
  backups:
