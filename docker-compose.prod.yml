# Plan Phase 0.2 — production-shaped compose file, host-agnostic (any
# Docker-capable Linux VM; Oracle Cloud is the intended eventual target but
# nothing here is Oracle-specific).
#
# Deliberately NOT an override merged on top of docker-compose.yml: that file
# runs Postgres as a local container with a bind-mounted volume, which its own
# header already calls out as "NOT a production topology" — production wants
# a managed instance or at minimum a Postgres run and backed up independently
# of the app containers' lifecycle. This file assumes that Postgres already
# exists somewhere reachable by URL and only runs api/, auth/, and the backup
# scheduler.
#
# Usage (see deploy/DEPLOY.md for the full walkthrough):
#   cp .env.prod.example .env   # then fill in every value
#   docker compose -f docker-compose.prod.yml --env-file .env run --rm db-migrate
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# api/ and auth/ publish only to 127.0.0.1 — nginx (deploy/nginx/*) is the
# only thing meant to reach them from outside the host, terminating TLS and
# proxying in. Binding to all interfaces here would put an unencrypted,
# un-proxied JWT-bearing API directly on the internet.

name: pandapay-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # One-shot. Run manually before the first `up -d` and after pulling any
  # commit that adds a migration — not part of the long-running stack, same
  # reasoning as docker-compose.yml's db-migrate but pointed at a real DB by
  # URL instead of a compose-local service name.
  db-migrate:
    build:
      context: ./db
      dockerfile: migrate/Dockerfile
    environment:
      ADMIN_DATABASE_URL: "${ADMIN_DATABASE_URL:?}"
      APP_USER_PASSWORD: "${APP_USER_PASSWORD:?}"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-false}"
    volumes:
      - ./db:/db:ro

  api:
    build:
      context: ./api
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      DATABASE_URL: "${API_DATABASE_URL:?}"
      DB_SSL: "${DB_SSL:-true}"
      PORT: "4000"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?}"
      INBOUND_EMAIL_WEBHOOK_SECRET: "${INBOUND_EMAIL_WEBHOOK_SECRET:?}"
      PARTNER_WEBHOOK_SECRET: "${PARTNER_WEBHOOK_SECRET:?}"
      IMAP_ENCRYPTION_KEY: "${IMAP_ENCRYPTION_KEY:?}"
    ports:
      - "127.0.0.1:4000:4000"

  auth:
    build:
      context: ./auth
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      DATABASE_URL: "${AUTH_DATABASE_URL:?}"
      DB_SSL: "${DB_SSL:-true}"
      PORT: "3210"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?}"
      JWT_ACCESS_TTL: "${JWT_ACCESS_TTL:-15m}"
      JWT_REFRESH_TTL: "${JWT_REFRESH_TTL:-30d}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?}"
      # Must be absent/false everywhere reachable from the internet — it lets
      # OTP verification succeed without sending a real code.
      ALLOW_TEST_OTP: "false"
      ENCRYPTION_ENABLED: "${ENCRYPTION_ENABLED:-true}"
      # The actual AES-256 key fieldEncryption.js needs — ENCRYPTION_ENABLED
      # alone does nothing without it. A code review of this file caught that
      # the first version of this compose file set ENCRYPTION_ENABLED=true
      # but never defined this, which makes encryption silently no-op (a
      # warning to stderr, nothing else) rather than fail loudly.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?}"
      # Generic SMTP — auth/src/services/emailService.js uses nodemailer
      # against any host, Gmail included. Without these, emailService.js
      # falls back to logging the OTP to the container's own stdout instead
      # of sending it, which works for local dev and is silently useless in
      # production (no user will ever see that log).
      EMAIL_HOST: "${EMAIL_HOST:?}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_USER: "${EMAIL_USER:?}"
      EMAIL_PASS: "${EMAIL_PASS:?}"
      EMAIL_FROM: "${EMAIL_FROM:?}"
      # No SMS provider (Twilio) configured — see .env.prod.example's note.
      # Phone OTP would otherwise accept a signup it can never actually
      # deliver a code for; email-only is the honest default until/unless an
      # SMS provider is added.
      ENABLE_PHONE_OTP: "${ENABLE_PHONE_OTP:-false}"
      ENABLE_EMAIL_OTP: "${ENABLE_EMAIL_OTP:-true}"
    ports:
      - "127.0.0.1:3210:3210"

  backup:
    build:
      context: ./db
      dockerfile: backup/Dockerfile
    # Required for crond — see db/backup/Dockerfile's comment on the
    # "setpgid: Operation not permitted" failure this avoids.
    init: true
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Superuser: restore_drill.sh needs CREATE DATABASE/DROP DATABASE, which
      # app_user is deliberately never granted (db/setup_app_role.sql).
      DATABASE_URL: "${ADMIN_DATABASE_URL:?}"
      BACKUP_DIR: /var/backups/pandapay
      RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-30}"
    volumes:
      - backups:/var/backups/pandapay

volumes:
  backups:
